<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跷跷板平衡 —— 怎样让两边一样重</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #87CEEB;
    touch-action: none;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .status {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    padding: 14px 30px;
    background: rgba(16, 22, 38, 0.85);
    border-radius: 30px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 16px;
    font-weight: 700;
    z-index: 10;
    white-space: nowrap;
    max-width: 92vw;
    text-align: center;
    transition: all 0.3s;
    color: #ffffff;
  }
  .status.balanced {
    background: rgba(40, 130, 60, 0.9);
    border-color: rgba(127, 221, 110, 0.6);
    color: #e8ffe0;
    box-shadow: 0 0 30px rgba(127, 221, 110, 0.5);
  }

  .readout {
    position: fixed;
    top: 20px; right: 20px;
    padding: 14px 18px;
    background: rgba(16, 22, 38, 0.85);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 13px;
    z-index: 10;
    line-height: 1.9;
    min-width: 200px;
  }
  .readout .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
  }
  .readout .lbl { color: #8898b0; }
  .readout .num {
    color: #ffd54f;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .readout .num.left { color: #ffb0d0; }
  .readout .num.right { color: #c8a878; }
  .readout .divider {
    margin: 6px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .panel {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: min(600px, 94vw);
    background: rgba(16, 22, 38, 0.9);
    padding: 16px 22px;
    border-radius: 20px;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .panel .hint-text {
    font-size: 13px;
    color: #a8c0e0;
    text-align: center;
    line-height: 1.5;
  }
  .panel .btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .panel button {
    padding: 12px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .panel button:hover {
    background: rgba(255, 255, 255, 0.18);
  }
  .panel button:active {
    transform: translateY(1px);
  }
  .panel button.primary {
    background: linear-gradient(135deg, #5eb3ff, #7fdd6e);
    color: #061020;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(94, 179, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="status" id="status">⚖️ 拖一拖小动物，让跷跷板平衡起来</div>

<div class="readout">
  <div class="row">
    <span class="lbl">🐰 兔子</span>
    <span class="num left" id="rabbitInfo">重 1 · 距离 0.5</span>
  </div>
  <div class="row">
    <span class="lbl">力矩</span>
    <span class="num left" id="rabbitTorque">0.50</span>
  </div>
  <div class="divider"></div>
  <div class="row">
    <span class="lbl">🐻 小熊</span>
    <span class="num right" id="bearInfo">重 2 · 距离 0.5</span>
  </div>
  <div class="row">
    <span class="lbl">力矩</span>
    <span class="num right" id="bearTorque">1.00</span>
  </div>
</div>

<div class="panel">
  <div class="hint-text">💡 重的一边要靠支点近一些，轻的一边要靠支点远一些</div>
  <div class="btns">
    <button id="btnHint" class="primary">💡 提示</button>
    <button id="btnReset">🔄 重新开始</button>
    <button id="btnSwap">🔄 交换重量</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   跷跷板平衡 —— 怎样让两边一样重
   ------------------------------------------------------------
   教材依据：
   第五章第三节「简易机械」—— 杠杆（第一种类型：支点在中间）
   第六章「转啊转！」—— 跷跷板、杠杆
   第一章「迷思概念」—— 幼儿以为"重的一边一定沉"

   核心概念：
   ① 杠杆三要素：支点、施力点、抗力点
   ② 跷跷板是支点在中间的杠杆
   ③ 决定平衡的不是重量本身，而是"重量 × 到支点的距离"（力矩）
   ④ 重的一边离支点近，轻的一边离支点远，也能平衡
   ⑤ 两边力矩相等 → 平衡；哪边力矩大 → 哪边下沉
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const statusEl = document.getElementById('status');
const rabbitInfoEl = document.getElementById('rabbitInfo');
const bearInfoEl = document.getElementById('bearInfo');
const rabbitTorqueEl = document.getElementById('rabbitTorque');
const bearTorqueEl = document.getElementById('bearTorque');
const btnHint = document.getElementById('btnHint');
const btnReset = document.getElementById('btnReset');
const btnSwap = document.getElementById('btnSwap');

let W = 800, H = 600, DPR = 1, S = 1;
let time = 0;

/* ---------- 跷跷板 ---------- */
const board = {
  pivotX: 0, pivotY: 0,
  halfLen: 0,
  thickness: 0,
  angle: 0,           // 当前角度（正 = 右端下沉）
  targetAngle: 0,
  scale: 1,
  shake: 0
};

/* ---------- 底座 ---------- */
const base = {
  w: 0, h: 0
};

/* ---------- 角色 ---------- */
const rabbit = {
  t: -0.5,            // 位置参数 -1 ~ 1（负数在左）
  weight: 1,          // 重量
  size: 0,
  bob: 0,
  happy: 0,
  dragging: false
};

const bear = {
  t: 0.5,
  weight: 2,
  size: 0,
  bob: 0,
  happy: 0,
  dragging: false
};

/* ---------- 交互 ---------- */
let dragging = null;
let activePointer = null;

/* ---------- 效果 ---------- */
let sparks = [];
let clouds = [];
let confetti = [];
let grassTufts = [];

/* ---------- 平衡状态 ---------- */
let isBalanced = false;
let balancedTime = 0;

/* ============================================================
   尺寸
============================================================ */
function resize() {
  let w = window.innerWidth || document.documentElement.clientWidth || 800;
  let h = window.innerHeight || document.documentElement.clientHeight || 600;
  if (w < 200) w = 800;
  if (h < 200) h = 600;

  W = w;
  H = h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.55, Math.min(1.15, H / 800));

  layoutScene();
  initClouds();
  initGrass();
}

function layoutScene() {
  // 支点位置
  board.pivotX = W * 0.5;
  board.pivotY = H * 0.62;
  board.halfLen = Math.min(W * 0.36, 300 * S);
  board.thickness = 14 * S;

  // 底座
  base.w = 90 * S;
  base.h = 60 * S;

  // 角色
  rabbit.size = 26 * S;
  bear.size = 32 * S;
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 4; i++) {
    const n = 4 + Math.floor(Math.random() * 3);
    const puffs = [];
    for (let j = 0; j < n; j++) {
      puffs.push({
        dx: (j - n / 2) * 30 * S + (Math.random() - 0.5) * 16 * S,
        dy: (Math.random() - 0.5) * 12 * S,
        r: (18 + Math.random() * 16) * S
      });
    }
    clouds.push({
      x: Math.random() * W,
      y: 40 * S + Math.random() * (H * 0.28),
      scale: 0.5 + Math.random() * 0.7,
      speed: 10 + Math.random() * 15,
      puffs: puffs
    });
  }
}

function initGrass() {
  grassTufts = [];
  const count = Math.floor(W / 40);
  for (let i = 0; i < count; i++) {
    grassTufts.push({
      x: (i + 0.5) * (W / count) + (Math.random() - 0.5) * 20,
      h: (10 + Math.random() * 16) * S,
      lean: (Math.random() - 0.5) * 0.5,
      phase: Math.random() * Math.PI * 2,
      color: ['#5BB85F', '#4a9e50', '#6bc86f'][Math.floor(Math.random() * 3)]
    });
  }
}

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}
function beep(freq, dur, vol, type, delay) {
  vol = vol || 0.07;
  type = type || 'sine';
  delay = delay || 0;
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur);
}
function sfxClick() { beep(520, 0.06, 0.05, 'triangle'); }
function sfxGrab() { beep(660, 0.06, 0.05, 'triangle'); }
function sfxBalanced() {
  beep(523, 0.14, 0.10);
  beep(659, 0.14, 0.10, 'sine', 0.12);
  beep(784, 0.16, 0.10, 'sine', 0.24);
  beep(1046, 0.30, 0.11, 'sine', 0.40);
}

/* ============================================================
   坐标转换：板子局部坐标 t ↔ 世界坐标
============================================================ */
function localToWorld(t) {
  // t = -1 板子左端，t = 1 板子右端
  const dx = Math.cos(board.angle) * board.halfLen * t;
  const dy = Math.sin(board.angle) * board.halfLen * t;
  return {
    x: board.pivotX + dx,
    y: board.pivotY + dy
  };
}

function worldToLocal(wx, wy) {
  const dx = wx - board.pivotX;
  const dy = wy - board.pivotY;
  const cos = Math.cos(board.angle);
  const sin = Math.sin(board.angle);
  // 投影到板方向
  const proj = dx * cos + dy * sin;
  return proj / board.halfLen;
}

/* ============================================================
   物理：跷跷板角度
============================================================ */
function computeAngle() {
  // 力矩 = 重量 × 到支点的距离（距离用 |t| 表示，因为是局部坐标的绝对距离）
  const leftDist = Math.abs(rabbit.t);
  const rightDist = Math.abs(bear.t);
  const leftTorque = rabbit.weight * leftDist;
  const rightTorque = bear.weight * rightDist;

  const diff = rightTorque - leftTorque;

  // 映射到角度
  const maxAngle = 0.32;
  const k = 0.35;
  let targetAngle = diff * k;
  targetAngle = Math.max(-maxAngle, Math.min(maxAngle, targetAngle));

  // 平衡判定
  const balanced = Math.abs(diff) < 0.05;
  return { targetAngle, balanced, leftTorque, rightTorque };
}

/* ============================================================
   更新
============================================================ */
function update(dt) {
  time += dt;

  // 角度平滑过渡
  const r = computeAngle();
  board.targetAngle = r.targetAngle;
  board.angle += (board.targetAngle - board.angle) * Math.min(1, dt * 5);

  // 平衡状态变化
  if (r.balanced && !isBalanced) {
    isBalanced = true;
    balancedTime = 0;
    sfxBalanced();
    spawnBalancedSparks();
    statusEl.textContent = '⚖️ 平衡啦！重量 × 距离 = 重量 × 距离';
    statusEl.classList.add('balanced');
    rabbit.happy = 1;
    bear.happy = 1;
    spawnConfetti();
  } else if (!r.balanced && isBalanced) {
    isBalanced = false;
    balancedTime = 0;
    statusEl.textContent = '⚖️ 拖一拖小动物，让跷跷板平衡起来';
    statusEl.classList.remove('balanced');
  }

  if (isBalanced) {
    balancedTime += dt;
    // 每 2.5 秒再庆祝一次
    if (balancedTime > 2.5) {
      balancedTime = 0;
      spawnConfetti();
      rabbit.happy = 1;
      bear.happy = 1;
    }
  }

  // 晃动衰减
  board.shake *= Math.exp(-dt * 3);

  // 角色 bob
  rabbit.bob = Math.sin(time * 2.2) * 1.2 * S;
  bear.bob = Math.sin(time * 2.0 + 0.8) * 1.2 * S;

  // happy 衰减
  rabbit.happy = Math.max(0, rabbit.happy - dt * 0.35);
  bear.happy = Math.max(0, bear.happy - dt * 0.35);

  // 云
  for (const c of clouds) {
    c.x += c.speed * dt;
    if (c.x - 200 * S > W) {
      c.x = -200 * S;
      c.y = 40 * S + Math.random() * (H * 0.28);
    }
  }

  // 粒子
  for (const s of sparks) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 240 * dt;
    s.vx *= 0.96;
    s.life -= dt * 1.2;
  }
  sparks = sparks.filter(s => s.life > 0);

  for (const c of confetti) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += 320 * dt;
    c.rot += c.rotSpeed * dt;
    c.life -= dt * 0.4;
  }
  confetti = confetti.filter(c => c.life > 0);

  updateReadout(r.leftTorque, r.rightTorque);
}

function updateReadout(leftTorque, rightTorque) {
  rabbitInfoEl.textContent = '重 ' + rabbit.weight + ' · 距离 ' + Math.abs(rabbit.t).toFixed(2);
  bearInfoEl.textContent = '重 ' + bear.weight + ' · 距离 ' + Math.abs(bear.t).toFixed(2);
  rabbitTorqueEl.textContent = leftTorque.toFixed(2);
  bearTorqueEl.textContent = rightTorque.toFixed(2);
}

function spawnBalancedSparks() {
  for (const side of [-1, 1]) {
    const t = side * 0.85;
    const p = localToWorld(t);
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const v = 80 + Math.random() * 140;
      sparks.push({
        x: p.x, y: p.y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 40,
        life: 1,
        size: 2.5 + Math.random() * 3,
        color: ['#ffe066', '#7fdd6e', '#a8e6ff'][i % 3]
      });
    }
  }
}

function spawnConfetti() {
  const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6'];
  for (let i = 0; i < 40; i++) {
    confetti.push({
      x: board.pivotX + (Math.random() - 0.5) * 200 * S,
      y: board.pivotY - 100 * S - Math.random() * 40 * S,
      vx: (Math.random() - 0.5) * 260,
      vy: -140 - Math.random() * 200,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 12,
      size: 4 + Math.random() * 5,
      color: colors[i % colors.length],
      life: 1
    });
  }
}

/* ============================================================
   绘制：背景
============================================================ */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  g.addColorStop(0, '#7EC8E3');
  g.addColorStop(0.6, '#A8DDF0');
  g.addColorStop(1, '#DFF3E4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.55);
}

function drawSun() {
  const sx = W * 0.86;
  const sy = H * 0.14;
  const r = 40 * S;

  const glow = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 4);
  glow.addColorStop(0, 'rgba(255, 245, 180, 0.7)');
  glow.addColorStop(0.4, 'rgba(255, 240, 160, 0.22)');
  glow.addColorStop(1, 'rgba(255, 240, 160, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, r * 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#FFF7C4';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, r * 0.82, 0, Math.PI * 2);
  ctx.fillStyle = '#FFFCE0';
  ctx.fill();
}

function drawClouds() {
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.beginPath();
    for (const p of c.puffs) {
      ctx.moveTo(p.dx + p.r, p.dy);
      ctx.arc(p.dx, p.dy, p.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.fill();
    ctx.restore();
  }
}

function drawGround() {
  const groundY = board.pivotY + base.h;

  const g = ctx.createLinearGradient(0, groundY - 20 * S, 0, H);
  g.addColorStop(0, '#7BD17F');
  g.addColorStop(0.4, '#5BB85F');
  g.addColorStop(1, '#3A7A40');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);

  // 地平线高光
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  // 草丛
  ctx.lineCap = 'round';
  for (const g2 of grassTufts) {
    const sway = Math.sin(time * 1.8 + g2.phase) * 0.15;
    const a = g2.lean + sway;
    const tipX = g2.x + Math.sin(a) * g2.h;
    const tipY = groundY + 4 * S - Math.cos(a) * g2.h;
    ctx.beginPath();
    ctx.moveTo(g2.x, groundY + 6 * S);
    ctx.quadraticCurveTo(
      g2.x + Math.sin(a * 0.5) * g2.h * 0.5,
      groundY + 4 * S - Math.cos(a * 0.5) * g2.h * 0.7,
      tipX, tipY
    );
    ctx.strokeStyle = g2.color;
    ctx.lineWidth = 2.2 * S;
    ctx.stroke();
  }
}

/* ============================================================
   绘制：底座
============================================================ */
function drawBase() {
  const px = board.pivotX;
  const py = board.pivotY;
  const bw = base.w;
  const bh = base.h;

  // 底座阴影
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  ctx.ellipse(px + 6 * S, py + bh + 4 * S, bw * 0.7, 12 * S, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // 三角形底座
  ctx.beginPath();
  ctx.moveTo(px - bw / 2, py + bh);
  ctx.lineTo(px + bw / 2, py + bh);
  ctx.lineTo(px, py);
  ctx.closePath();

  const grad = ctx.createLinearGradient(px - bw / 2, 0, px + bw / 2, 0);
  grad.addColorStop(0, '#8a5a2a');
  grad.addColorStop(0.5, '#c8904a');
  grad.addColorStop(1, '#6a3a18');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#4a2a10';
  ctx.lineWidth = 2.5 * S;
  ctx.stroke();

  // 底座上的木纹
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px - bw / 2, py + bh);
  ctx.lineTo(px + bw / 2, py + bh);
  ctx.lineTo(px, py);
  ctx.closePath();
  ctx.clip();

  ctx.strokeStyle = 'rgba(60, 30, 10, 0.5)';
  ctx.lineWidth = 1.2 * S;
  for (let i = 1; i < 4; i++) {
    const y = py + bh * i / 4;
    const w = bw * (1 - i / 4);
    ctx.beginPath();
    ctx.moveTo(px - w / 2, y);
    ctx.lineTo(px + w / 2, y);
    ctx.stroke();
  }
  ctx.restore();

  // 底座底部的高光
  ctx.beginPath();
  ctx.moveTo(px - bw / 2, py + bh);
  ctx.lineTo(px + bw / 2, py + bh);
  ctx.strokeStyle = 'rgba(255, 220, 160, 0.5)';
  ctx.lineWidth = 3 * S;
  ctx.stroke();

  // 顶端的支点小圆
  ctx.beginPath();
  ctx.arc(px, py, 8 * S, 0, Math.PI * 2);
  const pg = ctx.createRadialGradient(px - 3 * S, py - 3 * S, 1, px, py, 8 * S);
  pg.addColorStop(0, '#ffffff');
  pg.addColorStop(1, '#8a5a2a');
  ctx.fillStyle = pg;
  ctx.fill();
  ctx.strokeStyle = '#4a2a10';
  ctx.lineWidth = 1.8 * S;
  ctx.stroke();
}

/* ============================================================
   绘制：跷跷板板子
============================================================ */
function drawBoard() {
  // 使用世界坐标计算板子两端
  const left = localToWorld(-1);
  const right = localToWorld(1);

  // 板子阴影
  ctx.save();
  ctx.globalAlpha = 0.2;
  const shadowOffset = 6 * S;
  ctx.beginPath();
  ctx.moveTo(left.x + shadowOffset, left.y + shadowOffset);
  ctx.lineTo(right.x + shadowOffset, right.y + shadowOffset);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = board.thickness * 1.2;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // 板子主体
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left.x, left.y);
  ctx.lineTo(right.x, right.y);
  ctx.strokeStyle = '#c8904a';
  ctx.lineWidth = board.thickness;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // 板子亮部（沿板方向的渐变）
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left.x, left.y);
  ctx.lineTo(right.x, right.y);
  ctx.strokeStyle = '#e8b878';
  ctx.lineWidth = board.thickness * 0.55;
  ctx.stroke();
  ctx.restore();

  // 板子高光线
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left.x, left.y);
  ctx.lineTo(right.x, right.y);
  ctx.strokeStyle = 'rgba(255, 240, 200, 0.5)';
  ctx.lineWidth = board.thickness * 0.2;
  ctx.stroke();
  ctx.restore();

  // 支点附近标记
  const p = localToWorld(0);
  ctx.beginPath();
  ctx.arc(p.x, p.y, board.thickness * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(80, 50, 20, 0.5)';
  ctx.fill();

  // 板子上的位置刻度线（从 -1 到 1，每 0.25 一条短虚线）
  for (let t = -1; t <= 1; t += 0.25) {
    if (Math.abs(t) < 0.05) continue;
    const pos = localToWorld(t);
    const angle = board.angle;
    const perpX = -Math.sin(angle);
    const perpY = Math.cos(angle);
    ctx.beginPath();
    ctx.moveTo(pos.x + perpX * board.thickness * 0.6, pos.y + perpY * board.thickness * 0.6);
    ctx.lineTo(pos.x - perpX * board.thickness * 0.6, pos.y - perpY * board.thickness * 0.6);
    ctx.strokeStyle = 'rgba(80, 50, 20, 0.5)';
    ctx.lineWidth = 1.4 * S;
    ctx.stroke();
  }
}

/* ============================================================
   绘制：角色（兔子和小熊）
============================================================ */
function drawRabbit(t, size, happy) {
  const pos = localToWorld(t);

  // 影子
  ctx.beginPath();
  ctx.ellipse(pos.x, pos.y + size * 0.9, size * 0.9, size * 0.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fill();

  ctx.save();
  ctx.translate(pos.x, pos.y - size * 0.4 + rabbit.bob);
  ctx.scale(1, 1);

  // 耳朵
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * size * 0.28, -size * 0.75);
    ctx.rotate(side * 0.15);
    ctx.beginPath();
    ctx.ellipse(0, -size * 0.4, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#F5F0E6';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -size * 0.4, size * 0.1, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFC2D1';
    ctx.fill();
    ctx.restore();
  }

  // 头
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.85, 0, Math.PI * 2);
  const hg = ctx.createRadialGradient(-size * 0.25, -size * 0.25, size * 0.1, 0, 0, size * 0.9);
  hg.addColorStop(0, '#FFFFFF');
  hg.addColorStop(1, '#E8E0D0');
  ctx.fillStyle = hg;
  ctx.fill();

  // 眼睛
  const blink = (Math.sin(time * 1.2) > 0.97) ? 0.15 : 1;
  for (const side of [-1, 1]) {
    if (happy > 0.3) {
      // 开心弧线眼
      ctx.strokeStyle = '#2a2028';
      ctx.lineWidth = 2 * S;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(side * size * 0.28, -size * 0.05, size * 0.15, Math.PI + 0.4, -0.4);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(side * size * 0.28, -size * 0.05, size * 0.11, size * 0.11 * blink, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#2a2028';
      ctx.fill();
      if (blink > 0.5) {
        ctx.beginPath();
        ctx.arc(side * size * 0.28 + size * 0.04, -size * 0.09, size * 0.04, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }
  }

  // 鼻子
  ctx.beginPath();
  ctx.arc(0, size * 0.2, size * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = '#FF8FA3';
  ctx.fill();

  // 腮红
  if (happy > 0.2) {
    ctx.globalAlpha = happy * 0.7;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * size * 0.55, size * 0.1, size * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = '#ff8fa3';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 嘴
  if (happy > 0.3) {
    ctx.beginPath();
    ctx.arc(0, size * 0.32, size * 0.15, 0.15, Math.PI - 0.15);
    ctx.strokeStyle = '#5a3a2a';
    ctx.lineWidth = 1.8 * S;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  ctx.restore();

  // 重量标签
  drawWeightTag(pos.x, pos.y - size * 1.7, '×1', '#ffb0d0');
}

function drawBear(t, size, happy) {
  const pos = localToWorld(t);

  // 影子
  ctx.beginPath();
  ctx.ellipse(pos.x, pos.y + size * 0.9, size * 1.0, size * 0.22, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fill();

  ctx.save();
  ctx.translate(pos.x, pos.y - size * 0.4 + bear.bob);

  // 耳朵
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(side * size * 0.65, -size * 0.75, size * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#C8956B';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(side * size * 0.65, -size * 0.75, size * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = '#E8C9A8';
    ctx.fill();
  }

  // 头
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.95, 0, Math.PI * 2);
  const hg = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.1, 0, 0, size);
  hg.addColorStop(0, '#D8A57A');
  hg.addColorStop(1, '#A87850');
  ctx.fillStyle = hg;
  ctx.fill();

  // 口鼻区
  ctx.beginPath();
  ctx.ellipse(0, size * 0.28, size * 0.5, size * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#E8C9A8';
  ctx.fill();

  // 眼睛
  const blink = (Math.sin(time * 1.1 + 1) > 0.97) ? 0.15 : 1;
  for (const side of [-1, 1]) {
    if (happy > 0.3) {
      ctx.strokeStyle = '#2a1810';
      ctx.lineWidth = 2.4 * S;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(side * size * 0.32, -size * 0.05, size * 0.17, Math.PI + 0.4, -0.4);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(side * size * 0.32, -size * 0.05, size * 0.12, size * 0.12 * blink, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#2a1810';
      ctx.fill();
      if (blink > 0.5) {
        ctx.beginPath();
        ctx.arc(side * size * 0.32 + size * 0.04, -size * 0.09, size * 0.045, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }
  }

  // 鼻子
  ctx.beginPath();
  ctx.ellipse(0, size * 0.15, size * 0.14, size * 0.1, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#3a2518';
  ctx.fill();

  // 嘴
  if (happy > 0.3) {
    ctx.beginPath();
    ctx.arc(0, size * 0.32, size * 0.22, 0.15, Math.PI - 0.15);
    ctx.strokeStyle = '#3a2518';
    ctx.lineWidth = 2 * S;
    ctx.lineCap = 'round';
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, size * 0.25);
    ctx.lineTo(0, size * 0.32);
    ctx.moveTo(-size * 0.15, size * 0.4);
    ctx.quadraticCurveTo(0, size * 0.45, size * 0.15, size * 0.4);
    ctx.strokeStyle = '#3a2518';
    ctx.lineWidth = 1.6 * S;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 腮红
  if (happy > 0.2) {
    ctx.globalAlpha = happy * 0.6;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * size * 0.65, size * 0.18, size * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ff8fa3';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 重量标签
  drawWeightTag(pos.x, pos.y - size * 1.9, '×2', '#c8a878');
}

function drawWeightTag(x, y, text, color) {
  ctx.save();
  ctx.font = 'bold ' + Math.round(13 * S) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(text).width;
  const padX = 8 * S;
  const bh = 22 * S;

  ctx.fillStyle = 'rgba(16, 22, 38, 0.85)';
  roundRect(x - tw / 2 - padX, y - bh / 2, tw + padX * 2, bh, bh / 2);
  ctx.fill();

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5 * S;
  roundRect(x - tw / 2 - padX, y - bh / 2, tw + padX * 2, bh, bh / 2);
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.fillText(text, x, y + 1);
  ctx.restore();
}

/* ============================================================
   绘制：粒子
============================================================ */
function drawSparks() {
  for (const s of sparks) {
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.translate(s.x, s.y);
    drawStar(0, 0, s.size, s.size * 0.42, 5);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.restore();
  }
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, c.life * 1.5);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size * 0.7, c.size, c.size * 1.4);
    ctx.restore();
  }
}

function drawStar(cx, cy, outer, inner, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / points) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* ============================================================
   绘制：力矩可视化（在跷跷板两端画箭头显示力的大小）
============================================================ */
function drawTorqueIndicators() {
  const leftDist = Math.abs(rabbit.t);
  const rightDist = Math.abs(bear.t);
  const leftTorque = rabbit.weight * leftDist;
  const rightTorque = bear.weight * rightDist;

  const maxTorque = Math.max(leftTorque, rightTorque, 1);

  // 左端箭头
  drawTorqueArrow(-1, leftTorque, maxTorque, '#ffb0d0');
  // 右端箭头
  drawTorqueArrow(1, rightTorque, maxTorque, '#c8a878');
}

function drawTorqueArrow(side, torque, maxTorque, color) {
  const pos = localToWorld(side * 0.9);
  const arrowLen = 30 + (torque / maxTorque) * 60 * S;

  ctx.save();
  ctx.translate(pos.x, pos.y);

  // 箭头向下
  ctx.beginPath();
  ctx.moveTo(0, -arrowLen);
  ctx.lineTo(0, 0);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3 * S;
  ctx.lineCap = 'round';
  ctx.stroke();

  // 箭头
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-6 * S, -10 * S);
  ctx.lineTo(6 * S, -10 * S);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  // 力矩数值
  ctx.font = 'bold ' + Math.round(11 * S) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = color;
  ctx.fillText(torque.toFixed(2), 0, -arrowLen - 4 * S);

  ctx.restore();
}

/* ============================================================
   工具
============================================================ */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ============================================================
   渲染
============================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawSun();
  drawClouds();
  drawGround();
  drawBase();
  drawBoard();

  // 支点（在板子上面画一个小圆）
  const pivot = localToWorld(0);
  ctx.beginPath();
  ctx.arc(pivot.x, pivot.y, board.thickness * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = '#4a2a10';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pivot.x - 2 * S, pivot.y - 2 * S, board.thickness * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.fill();

  // 角色
  drawRabbit(rabbit.t, rabbit.size, rabbit.happy);
  drawBear(bear.t, bear.size, bear.happy);

  // 力矩箭头（不显示在平衡时）
  if (!isBalanced) {
    drawTorqueIndicators();
  }

  drawSparks();
  drawConfetti();
}

/* ============================================================
   交互
============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function hitCharacter(p, ch, size) {
  const pos = localToWorld(ch.t);
  const cx = pos.x;
  const cy = pos.y - size * 0.4;
  const dx = p.x - cx;
  const dy = p.y - cy;
  return (dx * dx + dy * dy) < (size * 1.6) * (size * 1.6);
}

function onDown(e) {
  initAudio();
  if (activePointer !== null) return;
  activePointer = e.pointerId;
  const p = getPos(e);

  // 优先抓熊（大一点），再抓兔子
  if (hitCharacter(p, bear, bear.size)) {
    dragging = 'bear';
    bear.dragging = true;
    sfxGrab();
    return;
  }
  if (hitCharacter(p, rabbit, rabbit.size)) {
    dragging = 'rabbit';
    rabbit.dragging = true;
    sfxGrab();
    return;
  }
}

function onMove(e) {
  if (activePointer !== e.pointerId) return;
  if (!dragging) return;
  const p = getPos(e);

  // 世界坐标转换到板局部坐标
  let t = worldToLocal(p.x, p.y);

  // 限制在板范围内
  if (dragging === 'rabbit') {
    // 兔子只能在左半区（负 t），防止穿过支点
    t = Math.max(-0.98, Math.min(-0.06, t));
    rabbit.t = t;
  } else {
    t = Math.max(0.06, Math.min(0.98, t));
    bear.t = t;
  }

  board.shake = 0.3;
}

function onUp(e) {
  if (activePointer !== e.pointerId) return;
  activePointer = null;
  if (dragging === 'rabbit') rabbit.dragging = false;
  if (dragging === 'bear') bear.dragging = false;
  dragging = null;
}

/* ============================================================
   按钮
============================================================ */
btnReset.addEventListener('click', function () {
  initAudio();
  sfxClick();
  rabbit.t = -0.5;
  bear.t = 0.5;
  rabbit.weight = 1;
  bear.weight = 2;
  rabbit.happy = 0;
  bear.happy = 0;
  isBalanced = false;
  sparks = [];
  confetti = [];
  statusEl.textContent = '⚖️ 拖一拖小动物，让跷跷板平衡起来';
  statusEl.classList.remove('balanced');
});

btnSwap.addEventListener('click', function () {
  initAudio();
  sfxClick();
  // 交换重量
  const temp = rabbit.weight;
  rabbit.weight = bear.weight;
  bear.weight = temp;
  isBalanced = false;
  statusEl.textContent = '🔄 重量交换了！再看看怎样能平衡';
  statusEl.classList.remove('balanced');
});

btnHint.addEventListener('click', function () {
  initAudio();
  sfxClick();
  // 自动放到平衡位置（轻的在外，重的在内）
  // 平衡条件：rabbit.weight * |rabbit.t| = bear.weight * |bear.t|
  // 让兔子距离为 0.8，熊的距离 = 0.8 * rabbit.weight / bear.weight
  const rabbitDist = 0.8;
  const bearDist = rabbitDist * rabbit.weight / bear.weight;

  gsap.to(rabbit, { t: -rabbitDist, duration: 0.7, ease: 'power2.inOut' });
  gsap.to(bear, { t: Math.min(0.95, bearDist), duration: 0.7, ease: 'power2.inOut' });
});

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('dblclick', function (e) { e.preventDefault(); });

/* ============================================================
   启动
============================================================ */
resize();
updateReadout(0.5, 1);

window.addEventListener('resize', function () {
  resize();
  render();
});

if (window.ResizeObserver) {
  new ResizeObserver(function () {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    if (cw > 0 && ch > 0 && (Math.abs(cw - W) > 1 || Math.abs(ch - H) > 1)) {
      resize();
      render();
    }
  }).observe(canvas);
}

render();
requestAnimationFrame(function () {
  resize();
  render();
});

gsap.ticker.add(function (t, deltaTime) {
  const dt = Math.min(deltaTime || 16, 50) / 1000;
  update(dt);
  render();
});
</script>
</body>
