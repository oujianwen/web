<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热传递实验室 · 热在物体里怎么跑</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 30% 20%, #12203a 0%, #070d18 60%, #04070d 100%);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .stage{width:min(100%,1180px);}
  canvas{
    display:block;width:100%;height:auto;border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(120,170,255,.10) inset;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  'use strict';

  const W = 960, H = 600;
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

  function roundRect(x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function hexToRgb(hex){
    const n = parseInt(hex.slice(1), 16);
    return [ (n >> 16) & 255, (n >> 8) & 255, n & 255 ];
  }
  function shade(hex, amt){
    const [r, g, b] = hexToRgb(hex);
    const f = v => Math.round(Math.min(255, Math.max(0, v * (1 + amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  /* ---------------- 布局常量 ---------------- */
  const ROD_X0   = 150;          // 棒的左端（贴着热源）
  const ROD_LEN  = 700;          // 棒长
  const ROD_H    = 30;           // 棒粗细
  const BEAD_X   = ROD_X0 + ROD_LEN * 0.80;   // 小珠子位置
  const HEAT_DECAY = 170;        // 热量沿棒衰减长度
  const BEAD_THRESHOLD = 0.45;   // 蜡融化阈值

  /* ---------------- 数据 ---------------- */
  const RODS = [
    { key:'metal',   name:'金属棒', sub:'传热最快', y:180, color:'#8ea8c3', hi:'#d6e6f7', dur:3.0 },
    { key:'plastic', name:'塑料棒', sub:'传热较慢', y:310, color:'#4bbfa6', hi:'#a9f0de', dur:5.5 },
    { key:'wood',    name:'木头棒', sub:'传热最慢', y:440, color:'#b07d4b', hi:'#e8c197', dur:8.5 }
  ];

  const sim = {};
  RODS.forEach(r => sim[r.key] = { p:0, drop:0, dropped:false, tween:null });

  /* ---------------- 背景 ---------------- */
  function drawBackground(t){
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0,    '#0c1526');
    g.addColorStop(0.55, '#101d33');
    g.addColorStop(1,    '#0a1322');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 左侧暖光氛围
    const rg = ctx.createRadialGradient(110, 300, 20, 110, 300, 560);
    rg.addColorStop(0,   'rgba(255,140,50,0.16)');
    rg.addColorStop(0.5, 'rgba(255,110,40,0.06)');
    rg.addColorStop(1,   'rgba(255,110,40,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // 网格点
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#8fb6e0';
    for(let x = 30; x < W; x += 40){
      for(let y = 30; y < H; y += 40){
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ---------------- 热源 ---------------- */
  function drawHeatPanel(t){
    const x = 92, y = 110, w = 58, h = 440;
    const flick = 0.85 + 0.15 * Math.sin(t * 5.5) + 0.06 * Math.sin(t * 13.1);

    ctx.save();
    ctx.shadowColor = 'rgba(255,110,30,' + (0.75 * flick) + ')';
    ctx.shadowBlur  = 46 * flick;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0,    '#ff3d12');
    g.addColorStop(0.45, '#ff8b25');
    g.addColorStop(1,    '#ffd66b');
    ctx.fillStyle = g;
    roundRect(x, y, w, h, w / 2);
    ctx.fill();
    ctx.restore();

    // 内高光
    ctx.save();
    roundRect(x, y, w, h, w / 2);
    ctx.clip();
    const g2 = ctx.createLinearGradient(x, 0, x + w, 0);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(1, 'rgba(255,255,255,0.45)');
    ctx.fillStyle = g2;
    ctx.fillRect(x, y, w, h);
    ctx.restore();

    ctx.save();
    ctx.font = '700 16px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,190,130,0.95)';
    ctx.fillText('热源', x + w / 2, y - 26);
    ctx.restore();
  }

  /* ---------------- 棒子 ---------------- */
  function drawRod(rod, t){
    const s = sim[rod.key];
    const y = rod.y;
    const x0 = ROD_X0, len = ROD_LEN;
    const front = x0 + len * s.p;     // 热量前锋位置

    // 投影
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(x0, y - ROD_H / 2, len, ROD_H, ROD_H / 2);
    ctx.fill();
    ctx.restore();

    // 棒体 + 热色（裁剪在圆角内）
    ctx.save();
    roundRect(x0, y - ROD_H / 2, len, ROD_H, ROD_H / 2);
    ctx.clip();

    const bg = ctx.createLinearGradient(0, y - ROD_H / 2, 0, y + ROD_H / 2);
    bg.addColorStop(0,    rod.hi);
    bg.addColorStop(0.42, rod.color);
    bg.addColorStop(1,    shade(rod.color, -0.35));
    ctx.fillStyle = bg;
    ctx.fillRect(x0, y - ROD_H / 2, len, ROD_H);

    const SEG = 110;
    for(let i = 0; i < SEG; i++){
      const xa = x0 + len * i / SEG;
      const xb = x0 + len * (i + 1) / SEG;
      const mx = (xa + xb) / 2;
      const heat = clamp01((front - mx) / HEAT_DECAY);
      if(heat <= 0.012) continue;
      const r  = 255;
      const gg = Math.round(200 - 130 * heat);
      const bb = Math.round(110 -  90 * heat);
      ctx.fillStyle = `rgba(${r},${gg},${bb},${0.12 + 0.78 * heat})`;
      ctx.fillRect(xa, y - ROD_H / 2, xb - xa + 1.2, ROD_H);
    }
    ctx.restore();

    // 热运动小颗粒（表示分子在“抖动”）
    ctx.save();
    const N = 30;
    for(let i = 0; i < N; i++){
      const px = x0 + len * (i + 0.5) / N;
      const heat = clamp01((front - px) / HEAT_DECAY);
      if(heat < 0.08) continue;
      const jx = Math.sin(t * 26 + i * 1.7) * heat * 2.4;
      const jy = Math.cos(t * 33 + i * 2.3) * heat * 2.4;
      ctx.fillStyle = `rgba(255,235,190,${0.20 * heat})`;
      ctx.beginPath();
      ctx.arc(px + jx, y + jy, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 轮廓
    ctx.save();
    roundRect(x0, y - ROD_H / 2, len, ROD_H, ROD_H / 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();

    // 热量前锋的辉光
    if(s.p > 0.005 && s.p < 0.995){
      const glowR = 62;
      const fg = ctx.createRadialGradient(front, y, 0, front, y, glowR);
      fg.addColorStop(0, 'rgba(255,190,110,0.42)');
      fg.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(front, y, glowR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,235,200,0.75)';
      ctx.fillRect(front - 2, y - ROD_H / 2 - 3, 4, ROD_H + 6);
    }
  }

  /* ---------------- 小珠子 ---------------- */
  function drawBead(rod){
    const s = sim[rod.key];
    const drop = s.drop;
    const alpha = 1 - clamp01((drop - 0.55) / 0.45);
    if(alpha <= 0.01) return;

    const x = BEAD_X;
    const y = rod.y + drop * 104;
    const r = 15;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 蜡（受热后消失）
    const wax = 1 - clamp01(drop / 0.35);
    if(wax > 0.01){
      ctx.beginPath();
      ctx.arc(x, y, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,225,140,${0.30 * wax})`;
      ctx.fill();
    }

    // 影子
    ctx.beginPath();
    ctx.ellipse(x + 3, y + r + 6, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // 珠子本体
    const g = ctx.createRadialGradient(x - 5, y - 6, 2, x, y, r);
    g.addColorStop(0,    '#d6f4ff');
    g.addColorStop(0.42, '#5cc8f5');
    g.addColorStop(1,    '#16639c');
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.stroke();

    // 高光
    ctx.beginPath();
    ctx.arc(x - 5, y - 6, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fill();

    ctx.restore();
  }

  /* ---------------- 标签 / 标题 / 页脚 ---------------- */
  function drawLabels(){
    RODS.forEach(rod => {
      ctx.save();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ctx.font = '700 18px ' + FONT;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillText(rod.name, 176, rod.y - 32);
      ctx.fillStyle = '#e9f3ff';
      ctx.fillText(rod.name, 175, rod.y - 33);

      const w = ctx.measureText(rod.name).width;

      ctx.font = '400 13px ' + FONT;
      ctx.fillStyle = 'rgba(146,178,214,0.9)';
      ctx.fillText('· ' + rod.sub, 175 + w + 8, rod.y - 32);

      ctx.restore();
    });
  }

  function drawHeader(){
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 27px ' + FONT;
    ctx.fillStyle = '#eaf4ff';
    ctx.fillText('热传递实验室', 40, 46);

    ctx.font = '400 15px ' + FONT;
    ctx.fillStyle = 'rgba(150,185,225,0.85)';
    ctx.fillText('热，是怎么在物体里跑的？', 40, 76);
    ctx.restore();
  }

  function drawFooter(){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '500 15px ' + FONT;
    ctx.fillStyle = 'rgba(170,200,232,0.92)';
    ctx.fillText('热总是从热的地方传到冷的地方', W / 2, 558);

    ctx.font = '400 14px ' + FONT;
    ctx.fillStyle = 'rgba(132,164,198,0.8)';
    ctx.fillText('小珠子用蜡粘在棒子上，蜡一化，珠子就掉下来', W / 2, 582);
    ctx.restore();
  }

  /* ---------------- 主循环 ---------------- */
  function render(){
    const t = performance.now() / 1000;
    ctx.clearRect(0, 0, W, H);
    drawBackground(t);
    drawHeader();
    drawHeatPanel(t);
    RODS.forEach(r => drawRod(r, t));
    RODS.forEach(r => drawBead(r));
    drawLabels();
    drawFooter();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  /* ---------------- 动画逻辑 ---------------- */
  function checkBead(rod){
    const s = sim[rod.key];
    if(s.dropped) return;
    const front = ROD_X0 + ROD_LEN * s.p;
    const heat = clamp01((front - BEAD_X) / HEAT_DECAY);
    if(heat > BEAD_THRESHOLD){
      s.dropped = true;
      s.tween = gsap.to(s, { drop: 1, duration: 1.2, ease: 'power2.in' });
    }
  }

  function resetAll(){
    RODS.forEach(rod => {
      const s = sim[rod.key];
      if(s.tween){ s.tween.kill(); s.tween = null; }
      s.dropped = false;
      s.drop = 0;
      s.p = 0;
    });
  }

  // 主时间轴：三根棒同时开始，速度不同，循环播放
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 3.2, onRepeat: resetAll });

  RODS.forEach(rod => {
    const s = sim[rod.key];
    tl.fromTo(s, { p: 0 }, {
      p: 1,
      duration: rod.dur,
      ease: 'none',
      onUpdate: () => checkBead(rod)
    }, 0);
  });

})();
</script>
</body>
</html>
