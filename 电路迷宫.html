<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电路迷宫 —— 怎样让灯泡亮起来</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #0a1018;
    touch-action: none;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  #c {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .status {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    background: rgba(16, 22, 38, 0.9);
    border-radius: 30px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    font-size: 15px;
    font-weight: 700;
    z-index: 10;
    white-space: nowrap;
    transition: all 0.25s;
    max-width: 92vw;
    text-align: center;
  }

  .panel {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .panel button {
    padding: 12px 22px;
    border-radius: 14px;
    background: rgba(16, 22, 38, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .panel button:hover {
    background: rgba(40, 60, 90, 0.9);
  }
  .panel button:active {
    transform: translateY(1px);
  }

  .hint-bar {
    position: fixed;
    top: 74px; left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    background: rgba(16, 22, 38, 0.75);
    border-radius: 20px;
    font-size: 13px;
    color: #a8c0e0;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 10;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="status" id="status">💡 把线连起来，让灯泡亮起来吧</div>
<div class="hint-bar">👆 从一个圆点拖到另一个圆点连线；点线可删除</div>

<div class="panel">
  <button id="btnHint">💡 提示</button>
  <button id="btnClear">🧹 全部清空</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   电路迷宫 —— 怎样让灯泡亮起来（稳健版）
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const statusEl = document.getElementById('status');
const btnHint = document.getElementById('btnHint');
const btnClear = document.getElementById('btnClear');

let W = 800, H = 600, DPR = 1, S = 1;
let time = 0;

/* ---------- 布局 ---------- */
const layout = {
  batX: 0, batY: 0,
  bulbX: 0, bulbY: 0,
  nodeR: 26,
  nodes: []
};

/* ---------- 导线 ---------- */
let wires = [];

/* ---------- 拖拽 ---------- */
let dragging = null;
let activePointer = null;

/* ---------- 视觉 ---------- */
let bulbGlow = 0;
let shortWarn = 0;
let sparks = [];
let resultTime = 0;

/* ============================================================
   尺寸
============================================================ */
function resize() {
  // 兜底：如果窗口尺寸异常，用默认值
  let w = window.innerWidth || document.documentElement.clientWidth || 800;
  let h = window.innerHeight || document.documentElement.clientHeight || 600;
  if (w < 200) w = 800;
  if (h < 200) h = 600;

  W = w;
  H = h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.55, Math.min(1.15, H / 800));

  layoutEverything();
}

function layoutEverything() {
  const cx = W * 0.5;
  const cy = H * 0.45;

  // 电池和灯泡的水平间距
  const gap = Math.min(W * 0.26, 240 * S);
  // 上下接线柱的竖直间距
  const vGap = Math.min(H * 0.17, 130 * S);

  layout.batX = cx - gap;
  layout.batY = cy;
  layout.bulbX = cx + gap;
  layout.bulbY = cy;
  layout.nodeR = 24 * S;

  layout.nodes = [
    { id: 'batPos', label: '+', x: layout.batX, y: layout.batY - vGap - 20 * S, role: 'pos' },
    { id: 'batNeg', label: '−', x: layout.batX, y: layout.batY + vGap + 20 * S, role: 'neg' },
    { id: 'bulbA',  label: 'A', x: layout.bulbX, y: layout.bulbY - vGap - 20 * S, role: 'bulbA' },
    { id: 'bulbB',  label: 'B', x: layout.bulbX, y: layout.bulbY + vGap + 20 * S, role: 'bulbB' }
  ];
}

function nodeById(id) {
  return layout.nodes.find(n => n.id === id);
}

/* ============================================================
   电路分析
============================================================ */
function neighbors(id, includeBulbInternal) {
  const result = new Set();
  for (const w of wires) {
    if (w.from === id) result.add(w.to);
    if (w.to === id) result.add(w.from);
  }
  if (includeBulbInternal) {
    if (id === 'bulbA') result.add('bulbB');
    if (id === 'bulbB') result.add('bulbA');
  }
  return result;
}

function bfs(start, includeBulbInternal) {
  const visited = new Set([start]);
  const queue = [start];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of neighbors(cur, includeBulbInternal)) {
      if (!visited.has(n)) {
        visited.add(n);
        queue.push(n);
      }
    }
  }
  return visited;
}

function hasCompleteCircuit() {
  return bfs('batPos', true).has('batNeg');
}

function hasShortCircuit() {
  return bfs('batPos', false).has('batNeg');
}

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}
function beep(freq, dur, vol, type, delay) {
  vol = vol || 0.07;
  type = type || 'sine';
  delay = delay || 0;
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur);
}
function sfxConnect() { beep(560, 0.08, 0.07, 'triangle'); }
function sfxDelete() { beep(320, 0.1, 0.06, 'triangle'); }
function sfxLightUp() {
  beep(523, 0.12, 0.09);
  beep(659, 0.12, 0.09, 'sine', 0.1);
  beep(784, 0.14, 0.09, 'sine', 0.2);
  beep(1046, 0.24, 0.09, 'sine', 0.34);
}
function sfxShort() {
  beep(220, 0.1, 0.08, 'square');
  beep(180, 0.12, 0.08, 'square', 0.1);
  beep(140, 0.16, 0.08, 'square', 0.22);
}

/* ============================================================
   状态更新
============================================================ */
let lastState = 'empty';
function updateCircuitState() {
  let st = 'empty';
  if (wires.length > 0) {
    if (hasShortCircuit()) st = 'short';
    else if (hasCompleteCircuit()) st = 'complete';
    else st = 'partial';
  }

  if (st !== lastState) {
    if (st === 'complete') {
      sfxLightUp();
      spawnSparks();
      statusEl.textContent = '💡 灯泡亮了！电流走了一个完整的圈';
      statusEl.style.color = '#ffe066';
      resultTime = 3;
    } else if (st === 'short') {
      sfxShort();
      shortWarn = 1;
      statusEl.textContent = '⚠️ 短路了！电流没经过灯泡，很危险';
      statusEl.style.color = '#ff6b6b';
      resultTime = 3;
    } else if (st === 'partial') {
      statusEl.textContent = '🤔 只连了一半，电流回不去电池';
      statusEl.style.color = '#a8c0e0';
    } else {
      statusEl.textContent = '💡 把线连起来，让灯泡亮起来吧';
      statusEl.style.color = '#ffffff';
    }
  }

  lastState = st;
}

function spawnSparks() {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 80 + Math.random() * 180;
    sparks.push({
      x: layout.bulbX, y: layout.bulbY,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 40,
      life: 1,
      size: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 10,
      color: ['#ffe066', '#ffb055', '#fff7c4'][i % 3]
    });
  }
}

function update(dt) {
  time += dt;

  // 灯泡亮度
  const isLit = hasCompleteCircuit() && !hasShortCircuit();
  const target = isLit ? 1 : 0;
  bulbGlow += (target - bulbGlow) * Math.min(1, dt * 5);

  // 短路警告
  shortWarn = Math.max(0, shortWarn - dt * 1.2);

  // 火花
  for (const s of sparks) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 200 * dt;
    s.vx *= 0.97;
    s.life -= dt * 1.1;
    s.rot += s.rotSpeed * dt;
  }
  sparks = sparks.filter(s => s.life > 0);

  // 结果提示淡出
  if (resultTime > 0) {
    resultTime -= dt;
    if (resultTime <= 0 && !isLit && !hasShortCircuit()) {
      statusEl.textContent = '💡 把线连起来，让灯泡亮起来吧';
      statusEl.style.color = '#ffffff';
    }
  }
}

/* ============================================================
   绘制：背景
============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1520');
  g.addColorStop(0.5, '#0a1018');
  g.addColorStop(1, '#050810');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 短路红光
  if (shortWarn > 0.01) {
    const pulse = Math.sin(time * 20) * 0.5 + 0.5;
    ctx.fillStyle = 'rgba(255, 40, 40, ' + (shortWarn * pulse * 0.18) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 舞台光晕
  const stage = ctx.createRadialGradient(W / 2, H * 0.45, 20, W / 2, H * 0.45, Math.max(W, H) * 0.6);
  stage.addColorStop(0, 'rgba(120, 180, 255, 0.10)');
  stage.addColorStop(1, 'rgba(120, 180, 255, 0)');
  ctx.fillStyle = stage;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   绘制：电池
============================================================ */
function drawBattery() {
  const cx = layout.batX;
  const cy = layout.batY;
  const bw = 80 * S;
  const bh = 160 * S;
  const left = cx - bw / 2;
  const top = cy - bh / 2;

  // 电池外壳
  const g = ctx.createLinearGradient(left, 0, left + bw, 0);
  g.addColorStop(0, '#2a3040');
  g.addColorStop(0.5, '#4a5468');
  g.addColorStop(1, '#1a2030');
  ctx.fillStyle = g;
  roundRect(left, top, bw, bh, 12 * S);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2 * S;
  roundRect(left, top, bw, bh, 12 * S);
  ctx.stroke();

  // 顶部的红色正极带
  const topBand = ctx.createLinearGradient(0, top + 8 * S, 0, top + 34 * S);
  topBand.addColorStop(0, '#ff8080');
  topBand.addColorStop(1, '#a02020');
  ctx.fillStyle = topBand;
  roundRect(left + 6 * S, top + 8 * S, bw - 12 * S, 26 * S, 6 * S);
  ctx.fill();

  // 底部的蓝色负极带
  const botBand = ctx.createLinearGradient(0, top + bh - 34 * S, 0, top + bh - 8 * S);
  botBand.addColorStop(0, '#5a8ec8');
  botBand.addColorStop(1, '#1e4a88');
  ctx.fillStyle = botBand;
  roundRect(left + 6 * S, top + bh - 34 * S, bw - 12 * S, 26 * S, 6 * S);
  ctx.fill();

  // 电池中间标签
  ctx.fillStyle = '#8898b0';
  ctx.font = 'bold ' + Math.round(13 * S) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('电池', cx, cy + 4 * S);

  // 正负符号
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + Math.round(28 * S) + 'px system-ui, sans-serif';
  ctx.fillText('+', cx, top + 21 * S);
  ctx.fillText('−', cx, top + bh - 21 * S);
}

/* ============================================================
   绘制：灯泡
============================================================ */
function drawBulb() {
  const cx = layout.bulbX;
  const cy = layout.bulbY;
  const r = 60 * S;

  // 光晕
  if (bulbGlow > 0.02) {
    const pulse = 1 + Math.sin(time * 6) * 0.06;
    const glowR = r * (2.4 + bulbGlow * 1.8) * pulse;
    const gg = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, glowR);
    gg.addColorStop(0, 'rgba(255, 240, 160, ' + (0.7 * bulbGlow) + ')');
    gg.addColorStop(0.35, 'rgba(255, 210, 80, ' + (0.35 * bulbGlow) + ')');
    gg.addColorStop(1, 'rgba(255, 200, 40, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();
  }

  // 玻璃球
  const glassGrad = ctx.createRadialGradient(
    cx - r * 0.35, cy - r * 0.4, r * 0.1,
    cx, cy, r
  );
  if (bulbGlow > 0.1) {
    glassGrad.addColorStop(0, 'rgba(255, 255, 220, ' + (0.4 + bulbGlow * 0.6) + ')');
    glassGrad.addColorStop(0.5, 'rgba(255, 235, 140, ' + (0.5 + bulbGlow * 0.5) + ')');
    glassGrad.addColorStop(1, 'rgba(255, 200, 60, ' + (0.6 + bulbGlow * 0.4) + ')');
  } else {
    glassGrad.addColorStop(0, 'rgba(180, 210, 240, 0.4)');
    glassGrad.addColorStop(1, 'rgba(120, 160, 200, 0.3)');
  }
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = glassGrad;
  ctx.fill();

  ctx.strokeStyle = bulbGlow > 0.4
    ? 'rgba(255, 240, 180, ' + (0.7 + bulbGlow * 0.3) + ')'
    : 'rgba(180, 200, 230, 0.6)';
  ctx.lineWidth = 3 * S;
  ctx.stroke();

  // 灯丝
  const filGrad = ctx.createLinearGradient(cx, cy - r * 0.5, cx, cy + r * 0.5);
  if (bulbGlow > 0.4) {
    filGrad.addColorStop(0, '#fff7c4');
    filGrad.addColorStop(0.5, '#ffd54f');
    filGrad.addColorStop(1, '#ffb055');
  } else {
    filGrad.addColorStop(0, '#5a6580');
    filGrad.addColorStop(1, '#3a4258');
  }
  ctx.strokeStyle = filGrad;
  ctx.lineWidth = 3 * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 12 * S, cy - 14 * S);
  ctx.lineTo(cx - 6 * S, cy + 8 * S);
  ctx.lineTo(cx + 6 * S, cy + 8 * S);
  ctx.lineTo(cx + 12 * S, cy - 14 * S);
  ctx.stroke();

  // 灯泡底座
  const baseY = cy + r * 0.92;
  ctx.fillStyle = '#9aa5b8';
  roundRect(cx - 16 * S, baseY - 4 * S, 32 * S, 16 * S, 3 * S);
  ctx.fill();

  ctx.fillStyle = '#b8c2d4';
  roundRect(cx - 11 * S, cy + r * 0.72, 22 * S, r * 0.32, 3 * S);
  ctx.fill();

  // 高光
  ctx.beginPath();
  ctx.arc(cx - r * 0.32, cy - r * 0.36, r * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.4 + bulbGlow * 0.5) + ')';
  ctx.fill();
}

/* ============================================================
   绘制：导线
============================================================ */
function getWireCtrl(a, b) {
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const perpX = -dy / len;
  const perpY = dx / len;
  const bulge = 22 * S;
  return { x: mx + perpX * bulge, y: my + perpY * bulge };
}

function getWireColor() {
  if (hasShortCircuit()) return '#ff4444';
  if (hasCompleteCircuit() && bulbGlow > 0.4) return '#ffe066';
  return '#8898b0';
}

function drawWire(a, b, color) {
  const ctrl = getWireCtrl(a, b);

  // 外辉光
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(ctrl.x, ctrl.y, b.x, b.y);
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = 12 * S;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 主线
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(ctrl.x, ctrl.y, b.x, b.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 5 * S;
  ctx.stroke();

  // 高光内芯
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(ctrl.x, ctrl.y, b.x, b.y);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1.6 * S;
  ctx.stroke();

  // 电流小点
  if (hasCompleteCircuit() && bulbGlow > 0.4) {
    for (let i = 0; i < 3; i++) {
      const t = (time * 0.8 + i / 3) % 1;
      const u = 1 - t;
      const px = u * u * a.x + 2 * u * t * ctrl.x + t * t * b.x;
      const py = u * u * a.y + 2 * u * t * ctrl.y + t * t * b.y;

      const g = ctx.createRadialGradient(px, py, 0, px, py, 10 * S);
      g.addColorStop(0, 'rgba(255, 245, 180, 0.9)');
      g.addColorStop(1, 'rgba(255, 245, 180, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, 10 * S, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, py, 4 * S, 0, Math.PI * 2);
      ctx.fillStyle = '#fff7c4';
      ctx.fill();
    }
  }
}

/* ============================================================
   绘制：接线柱
============================================================ */
function drawNode(n) {
  const r = layout.nodeR;

  // 高亮（悬停或拖拽来源）
  const isFrom = dragging && dragging.fromNode === n.id;
  const isHover = dragging && !isFrom && dragging.pos &&
    Math.hypot(dragging.pos.x - n.x, dragging.pos.y - n.y) < r * 1.7;
  if (isFrom || isHover) {
    const gg = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, r * 2.4);
    gg.addColorStop(0, 'rgba(255, 240, 140, 0.7)');
    gg.addColorStop(1, 'rgba(255, 240, 140, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 2.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 金属环
  const ringGrad = ctx.createRadialGradient(
    n.x - r * 0.3, n.y - r * 0.3, r * 0.1,
    n.x, n.y, r
  );
  if (n.role === 'pos') {
    ringGrad.addColorStop(0, '#ff9090');
    ringGrad.addColorStop(0.7, '#c43030');
    ringGrad.addColorStop(1, '#601010');
  } else if (n.role === 'neg') {
    ringGrad.addColorStop(0, '#90b0ff');
    ringGrad.addColorStop(0.7, '#3060c4');
    ringGrad.addColorStop(1, '#103060');
  } else {
    ringGrad.addColorStop(0, '#e0e8f4');
    ringGrad.addColorStop(0.7, '#a8b4c8');
    ringGrad.addColorStop(1, '#5a6580');
  }

  ctx.beginPath();
  ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
  ctx.fillStyle = ringGrad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = 2 * S;
  ctx.stroke();

  // 内圈暗色，凸显标签
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 0.68, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fill();

  // 标签
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + Math.round(22 * S) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(n.label, n.x, n.y + 1);
}

/* ============================================================
   绘制：拖动虚线
============================================================ */
function drawDraggingLine() {
  if (!dragging || !dragging.pos) return;
  const a = nodeById(dragging.fromNode);
  if (!a) return;
  const b = dragging.pos;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = 'rgba(255, 240, 140, 0.9)';
  ctx.lineWidth = 4 * S;
  ctx.lineCap = 'round';
  ctx.setLineDash([10 * S, 8 * S]);
  ctx.lineDashOffset = -time * 30 * S;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(b.x, b.y, 8 * S, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 240, 140, 0.6)';
  ctx.fill();
}

/* ============================================================
   绘制：火花
============================================================ */
function drawSparks() {
  for (const s of sparks) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = s.life;
    drawStar(0, 0, s.size, s.size * 0.42, 5);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawStar(cx, cy, outer, inner, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / points) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* ============================================================
   工具
============================================================ */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ============================================================
   渲染
============================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawBattery();
  drawBulb();

  // 导线
  const color = getWireColor();
  for (const w of wires) {
    const a = nodeById(w.from);
    const b = nodeById(w.to);
    if (a && b) drawWire(a, b, color);
  }

  drawDraggingLine();

  // 接线柱
  for (const n of layout.nodes) {
    drawNode(n);
  }

  drawSparks();
}

/* ============================================================
   交互
============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function hitNode(p) {
  const r = layout.nodeR * 1.6;
  for (const n of layout.nodes) {
    if (Math.hypot(p.x - n.x, p.y - n.y) < r) return n;
  }
  return null;
}

function hitWire(p) {
  const r = 18 * S;
  for (let i = wires.length - 1; i >= 0; i--) {
    const w = wires[i];
    const a = nodeById(w.from);
    const b = nodeById(w.to);
    if (!a || !b) continue;
    const ctrl = getWireCtrl(a, b);
    for (let t = 0; t <= 1; t += 0.08) {
      const u = 1 - t;
      const px = u * u * a.x + 2 * u * t * ctrl.x + t * t * b.x;
      const py = u * u * a.y + 2 * u * t * ctrl.y + t * t * b.y;
      if (Math.hypot(p.x - px, p.y - py) < r) return i;
    }
  }
  return -1;
}

function onDown(e) {
  initAudio();
  if (activePointer !== null) return;
  activePointer = e.pointerId;

  const p = getPos(e);

  const n = hitNode(p);
  if (n) {
    dragging = { fromNode: n.id, pos: p };
    return;
  }

  const wi = hitWire(p);
  if (wi >= 0) {
    wires.splice(wi, 1);
    sfxDelete();
    updateCircuitState();
  }
}

function onMove(e) {
  if (activePointer !== e.pointerId) return;
  if (!dragging) return;
  dragging.pos = getPos(e);
}

function onUp(e) {
  if (activePointer !== e.pointerId) return;
  activePointer = null;

  if (!dragging) return;
  const p = getPos(e);
  const fromId = dragging.fromNode;
  dragging = null;

  const n = hitNode(p);
  if (!n || n.id === fromId) return;

  const exists = wires.some(w =>
    (w.from === fromId && w.to === n.id) ||
    (w.to === fromId && w.from === n.id)
  );
  if (exists) return;

  wires.push({ from: fromId, to: n.id });
  sfxConnect();
  updateCircuitState();
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('dblclick', function (e) { e.preventDefault(); });

/* ============================================================
   按钮
============================================================ */
btnHint.addEventListener('click', function () {
  initAudio();

  const hasPosToA = wires.some(w =>
    (w.from === 'batPos' && w.to === 'bulbA') || (w.from === 'bulbA' && w.to === 'batPos'));
  const hasPosToB = wires.some(w =>
    (w.from === 'batPos' && w.to === 'bulbB') || (w.from === 'bulbB' && w.to === 'batPos'));
  const hasNegToA = wires.some(w =>
    (w.from === 'batNeg' && w.to === 'bulbA') || (w.from === 'bulbA' && w.to === 'batNeg'));
  const hasNegToB = wires.some(w =>
    (w.from === 'batNeg' && w.to === 'bulbB') || (w.from === 'bulbB' && w.to === 'batNeg'));

  if (!hasPosToA && !hasPosToB) {
    wires.push({ from: 'batPos', to: 'bulbA' });
  } else if (!hasNegToA && !hasNegToB) {
    wires.push({ from: 'batNeg', to: 'bulbB' });
  } else {
    wires = [];
  }
  updateCircuitState();
});

btnClear.addEventListener('click', function () {
  initAudio();
  wires = [];
  sfxDelete();
  updateCircuitState();
});

/* ============================================================
   启动
============================================================ */
resize();

// 尺寸变化时重新布局（重新计算节点位置，保留导线）
window.addEventListener('resize', function () {
  resize();
  render();
});

// 用 ResizeObserver 兜底（有的浏览器首次内尺寸为 0）
if (window.ResizeObserver) {
  new ResizeObserver(function () {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    if (cw > 0 && ch > 0 && (Math.abs(cw - W) > 1 || Math.abs(ch - H) > 1)) {
      resize();
      render();
    }
  }).observe(canvas);
}

// 首帧主动渲染两次，确保尺寸稳定后再画一遍
render();
requestAnimationFrame(function () {
  resize();
  render();
});

gsap.ticker.add(function (t, deltaTime) {
  const dt = Math.min(deltaTime || 16, 50) / 1000;
  update(dt);
  render();
});
</script>
</body>
