<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>风车与风力发电 —— 怎样让灯泡亮起来</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #87CEEB;
    touch-action: none;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .status {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 26px;
    background: rgba(16, 22, 38, 0.82);
    border-radius: 30px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 15px;
    font-weight: 700;
    z-index: 10;
    white-space: nowrap;
    max-width: 92vw;
    text-align: center;
    transition: all 0.3s;
  }

  .readout {
    position: fixed;
    top: 20px; right: 20px;
    padding: 14px 18px;
    background: rgba(16, 22, 38, 0.85);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 13px;
    z-index: 10;
    line-height: 1.8;
    min-width: 180px;
  }
  .readout .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
  }
  .readout .lbl { color: #8898b0; }
  .readout .num {
    color: #ffd54f;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .battery-wrap {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .battery-label {
    color: #8898b0;
    font-size: 12px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .battery-bar {
    height: 10px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .battery-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7fdd6e, #ffd54f);
    border-radius: 5px;
    transition: width 0.15s linear;
  }

  .panel {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: min(560px, 94vw);
    background: rgba(16, 22, 38, 0.9);
    padding: 16px 22px;
    border-radius: 20px;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .panel .row {
    display: grid;
    grid-template-columns: 90px 1fr 64px;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .panel .lbl {
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }
  .panel input[type="range"] {
    width: 100%;

    accent-color: #5eb3ff;

  }
  .panel .val {
    text-align: right;

  }
  .panel .blades-row {
    display: flex;
    align-items: center;

  }
  .panel .blades-row .lbl {
    white-space: nowrap;
  }
  .panel .blade-btn {
    flex: 1;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .panel .blade-btn.active {
    background: linear-gradient(135deg, #5eb3ff, #7fdd6e);
    color: #061020;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(94, 179, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="status" id="status">🌬️ 拖一拖风速，看看叶片会不会转</div>

<div class="readout">
  <div class="row"><span class="lbl">转速</span><span class="num" id="rpmVal">0</span></div>
  <div class="row"><span class="lbl">发电</span><span class="num" id="powerVal">0</span></div>
  <div class="battery-wrap">
    <div class="battery-label"><span>🔋 电池</span><span id="chargeVal">0%</span></div>
    <div class="battery-bar"><div class="battery-fill" id="chargeBar"></div></div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <span class="lbl">🌬️ 风速</span>
    <input type="range" id="wind" min="0" max="100" value="50">
    <span class="val" id="windv">中</span>
  </div>
  <div class="row">
    <span class="lbl">📐 叶片角度</span>
    <input type="range" id="angle" min="0" max="90" value="30">
    <span class="val" id="anglev">30°</span>
  </div>
  <div class="blades-row">
    <span class="lbl">🌀 叶片数</span>
    <button class="blade-btn" data-n="3">3 片</button>
    <button class="blade-btn" data-n="4">4 片</button>
    <button class="blade-btn" data-n="6">6 片</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   风车与风力发电 —— 怎样让灯泡亮起来
   ------------------------------------------------------------
   教材依据：
   第五章第三节「简易机械」—— 轮子、转动
   第七章 STEM「各领域与社会联结」—— 科技对人类与自然的影响
   第七章「风力发电的大型风车」—— 社会贡献

   核心概念：
   ① 风吹叶片，叶片转动
   ② 风越大，叶片转得越快，发电越多
   ③ 叶片角度不合适，转得慢甚至不转
   ④ 风力是可再生能源，可以发电
   ⑤ 电存进电池，电池充满，灯泡就亮
   ⑥ 叶片数影响受力与转速
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const statusEl = document.getElementById('status');
const rpmValEl = document.getElementById('rpmVal');
const powerValEl = document.getElementById('powerVal');
const chargeValEl = document.getElementById('chargeVal');
const chargeBarEl = document.getElementById('chargeBar');
const windSlider = document.getElementById('wind');
const angleSlider = document.getElementById('angle');
const windValEl = document.getElementById('windv');
const angleValEl = document.getElementById('anglev');
const bladeBtns = document.querySelectorAll('.blade-btn');

let W = 800, H = 600, DPR = 1, S = 1;
let time = 0;

/* ---------- 状态 ---------- */
const state = {
  wind: 0.50,          // 0 ~ 1
  bladeAngle: 30,      // 0 ~ 90 度
  bladeCount: 3,       // 3 / 4 / 6
  omega: 0,            // 当前叶片角速度（弧度/秒）
  bladeRotation: 0,
  power: 0,            // 当前发电功率（0 ~ 1）
  charge: 0,           // 电池电量（0 ~ 1）
  bulbLit: 0,          // 灯泡亮度（0 ~ 1）
  bulbWasLit: false
};

/* ---------- 场景布局 ---------- */
const scene = {
  groundY: 0,
  towerX: 0,
  towerBaseY: 0,
  towerTopY: 0,
  towerWidthBottom: 0,
  towerWidthTop: 0,
  hubX: 0,
  hubY: 0,
  bladeLen: 0,
  bulbX: 0,
  bulbY: 0,
  bulbR: 0
};

/* ---------- 效果 ---------- */
let windLines = [];
let sparks = [];
let clouds = [];
let bgBirds = [];

/* ============================================================
   尺寸
============================================================ */
function resize() {
  let w = window.innerWidth || document.documentElement.clientWidth || 800;
  let h = window.innerHeight || document.documentElement.clientHeight || 600;
  if (w < 200) w = 800;
  if (h < 200) h = 600;

  W = w;
  H = h;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.55, Math.min(1.15, H / 800));

  layoutScene();
  initClouds();
  initBirds();
}

function layoutScene() {
  scene.groundY = H * 0.68;

  // 塔架
  scene.towerX = W * 0.36;
  scene.towerBaseY = scene.groundY;
  scene.towerTopY = H * 0.24;
  scene.towerWidthBottom = 22 * S;
  scene.towerWidthTop = 12 * S;

  // 轮毂（叶片旋转中心）
  scene.hubX = scene.towerX;
  scene.hubY = scene.towerTopY - 4 * S;
  scene.bladeLen = Math.min(W, H) * 0.16;

  // 灯泡
  scene.bulbX = W * 0.70;
  scene.bulbY = scene.groundY - 60 * S;
  scene.bulbR = 34 * S;
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    const n = 4 + Math.floor(Math.random() * 3);
    const puffs = [];
    for (let j = 0; j < n; j++) {
      puffs.push({
        dx: (j - n / 2) * 30 * S + (Math.random() - 0.5) * 18 * S,
        dy: (Math.random() - 0.5) * 14 * S,
        r: (18 + Math.random() * 16) * S
      });
    }
    clouds.push({
      x: Math.random() * W,
      y: 40 * S + Math.random() * (scene.groundY * 0.35),
      scale: 0.55 + Math.random() * 0.7,
      speed: 10 + Math.random() * 20,
      puffs: puffs
    });
  }
}

function initBirds() {
  bgBirds = [];
  for (let i = 0; i < 3; i++) {
    bgBirds.push({
      x: Math.random() * W,
      y: 80 * S + Math.random() * 60 * S,
      speed: 18 + Math.random() * 20,
      phase: Math.random() * Math.PI * 2
    });
  }
}

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
let windGainNode = null;
let windOscNode = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}
function beep(freq, dur, vol, type, delay) {
  vol = vol || 0.07;
  type = type || 'sine';
  delay = delay || 0;
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur);
}
function sfxClick() { beep(520, 0.06, 0.05, 'triangle'); }
function sfxCharged() {
  beep(523, 0.14, 0.09);
  beep(659, 0.14, 0.09, 'sine', 0.12);
  beep(784, 0.14, 0.09, 'sine', 0.24);
  beep(1046, 0.30, 0.10, 'sine', 0.40);
}

/* ============================================================
   物理更新
============================================================ */
function computeEfficiency() {
  // 角度效率：最佳约 30°，偏离越远效率越低
  const idealAngle = 30;
  const angleDiff = Math.abs(state.bladeAngle - idealAngle);
  const angleEff = Math.exp(-Math.pow(angleDiff / 28, 2));

  // 叶片数效率：3 片最佳，4 片稍低，6 片更低但更有"力量感"
  const bladeEff = state.bladeCount === 3 ? 1.0 :
                   state.bladeCount === 4 ? 0.92 : 0.82;

  return angleEff * bladeEff;
}

function update(dt) {
  time += dt;

  const eff = computeEfficiency();

  // 目标角速度：风速² × 效率 × 基准
  const windFactor = state.wind * state.wind;   // 简化：与风速平方相关
  const targetOmega = windFactor * eff * 12;    // 弧度/秒

  // 平滑过渡
  state.omega += (targetOmega - state.omega) * Math.min(1, dt * 2.5);
  state.bladeRotation += state.omega * dt;

  // 发电功率
  state.power = state.omega * 0.10;   // 0 ~ 1.2 左右
  state.power = Math.min(1, state.power);

  // 电池充电
  if (state.power > 0.05) {
    state.charge = Math.min(1, state.charge + state.power * dt * 0.10);
  }

  // 灯泡亮度
  const target = state.charge >= 0.99 ? 1 : 0;
  state.bulbLit += (target - state.bulbLit) * Math.min(1, dt * 4);

  // 首次亮起
  if (state.bulbLit > 0.5 && !state.bulbWasLit) {
    state.bulbWasLit = true;
    sfxCharged();
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 80 + Math.random() * 180;
      sparks.push({
        x: scene.bulbX, y: scene.bulbY,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 60,
        life: 1,
        size: 3 + Math.random() * 4,
        color: ['#ffe066', '#fff7c4', '#a8e6ff'][i % 3]
      });
    }
  }

  // 风的流线
  if (state.wind > 0.15 && Math.random() < state.wind * 4 * dt * 60 / 60) {
    windLines.push({
      x: -40 * S,
      y: 60 * S + Math.random() * (scene.groundY - 60 * S),
      vx: 200 + state.wind * 400,
      len: (30 + Math.random() * 50) * S,
      life: 1
    });
  }
  for (const w of windLines) {
    w.x += w.vx * dt;
    w.life -= dt * 0.55;
    if (w.x > W + 100) w.dead = true;
  }
  windLines = windLines.filter(w => !w.dead);

  // 云
  for (const c of clouds) {
    c.x += c.speed * dt * (0.4 + state.wind * 1.6);
    if (c.x - 200 * S > W) {
      c.x = -200 * S;
      c.y = 40 * S + Math.random() * (scene.groundY * 0.35);
    }
  }

  // 小鸟
  for (const b of bgBirds) {
    b.x += b.speed * dt * (0.4 + state.wind);
    b.phase += dt * 4;
    if (b.x - 40 * S > W) {
      b.x = -40 * S;
      b.y = 80 * S + Math.random() * 60 * S;
    }
  }

  // 火花
  for (const s of sparks) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 240 * dt;
    s.vx *= 0.96;
    s.life -= dt * 1.2;
  }
  sparks = sparks.filter(s => s.life > 0);

  updateUI();
}

/* ============================================================
   UI 更新
============================================================ */
function updateUI() {
  const rpm = Math.round(state.omega * 60 / (Math.PI * 2));
  const power = Math.round(state.power * 100);
  const charge = Math.round(state.charge * 100);

  rpmValEl.textContent = rpm;
  powerValEl.textContent = power + '%';
  chargeValEl.textContent = charge + '%';
  chargeBarEl.style.width = (charge) + '%';

  // 状态提示
  if (state.bulbLit > 0.5) {
    statusEl.textContent = '💡 灯泡亮了！风能变成了电';
    statusEl.style.color = '#ffe066';
  } else if (state.charge >= 0.5) {
    statusEl.textContent = '🔋 电池充电中…… 再转一会儿就满了';
    statusEl.style.color = '#7fdd6e';
  } else if (state.power > 0.3) {
    statusEl.textContent = '⚡ 叶片转得很快，正在发电';
    statusEl.style.color = '#ffd54f';
  } else if (state.power > 0.05) {
    statusEl.textContent = '🌬️ 转得有点慢，把风速调大试试';
    statusEl.style.color = '#a8c0e0';
  } else if (state.wind < 0.1) {
    statusEl.textContent = '😴 没有风，风车不转了';
    statusEl.style.color = '#8898b0';
  } else {
    statusEl.textContent = '📐 试着调一下叶片角度，看看会不会转起来';
    statusEl.style.color = '#a8c0e0';
  }
}

/* ============================================================
   绘制：天空
============================================================ */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, scene.groundY);
  g.addColorStop(0, '#5bb8e0');
  g.addColorStop(0.6, '#a8ddf0');
  g.addColorStop(1, '#dfeff5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, scene.groundY);
}

function drawSun() {
  const sx = W * 0.86;
  const sy = H * 0.14;
  const r = 42 * S;

  const glow = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 4);
  glow.addColorStop(0, 'rgba(255, 245, 180, 0.7)');
  glow.addColorStop(0.4, 'rgba(255, 240, 160, 0.22)');
  glow.addColorStop(1, 'rgba(255, 240, 160, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, r * 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#FFF7C4';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, r * 0.82, 0, Math.PI * 2);
  ctx.fillStyle = '#FFFCE0';
  ctx.fill();
}

function drawClouds() {
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.beginPath();
    for (const p of c.puffs) {
      ctx.moveTo(p.dx + p.r, p.dy);
      ctx.arc(p.dx, p.dy, p.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.fill();
    ctx.restore();
  }
}

function drawBirds() {
  ctx.strokeStyle = 'rgba(60, 80, 100, 0.6)';
  ctx.lineWidth = 1.8 * S;
  ctx.lineCap = 'round';
  for (const b of bgBirds) {
    ctx.save();
    ctx.translate(b.x, b.y);
    const flap = Math.sin(b.phase) * 4 * S;
    ctx.beginPath();
    ctx.moveTo(-10 * S, 0);
    ctx.quadraticCurveTo(-5 * S, -4 * S + flap * 0.4, 0, 0);
    ctx.quadraticCurveTo(5 * S, -4 * S + flap * 0.4, 10 * S, 0);
    ctx.stroke();
    ctx.restore();
  }
}

function drawGround() {
  const g = ctx.createLinearGradient(0, scene.groundY, 0, H);
  g.addColorStop(0, '#7BD17F');
  g.addColorStop(0.4, '#5BB85F');
  g.addColorStop(1, '#3A7A40');
  ctx.fillStyle = g;
  ctx.fillRect(0, scene.groundY, W, H - scene.groundY);

  // 地平线高光
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(0, scene.groundY);
  ctx.lineTo(W, scene.groundY);
  ctx.stroke();

  // 草
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = 1.4 * S;
  for (let x = 20; x < W; x += 36 * S) {
    const y1 = scene.groundY + 12 * S + Math.sin(x * 0.05) * 6 * S;
    ctx.beginPath();
    ctx.moveTo(x, scene.groundY + 6 * S);
    ctx.lineTo(x + 3 * S, y1);
    ctx.stroke();
  }
}

/* ============================================================
   绘制：风车塔架
============================================================ */
function drawTower() {
  const bx = scene.towerX;
  const by = scene.towerBaseY;
  const ty = scene.towerTopY;
  const wb = scene.towerWidthBottom;
  const wt = scene.towerWidthTop;

  // 塔架阴影
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  ctx.ellipse(bx + 8 * S, by + 4 * S, 42 * S, 8 * S, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // 塔架主体（上窄下宽）
  ctx.beginPath();
  ctx.moveTo(bx - wb / 2, by);
  ctx.lineTo(bx - wt / 2, ty);
  ctx.lineTo(bx + wt / 2, ty);
  ctx.lineTo(bx + wb / 2, by);
  ctx.closePath();

  const towerGrad = ctx.createLinearGradient(bx - wb / 2, 0, bx + wb / 2, 0);
  towerGrad.addColorStop(0, '#c8d0d8');
  towerGrad.addColorStop(0.45, '#eef2f6');
  towerGrad.addColorStop(0.7, '#e0e6ec');
  towerGrad.addColorStop(1, '#8a94a0');
  ctx.fillStyle = towerGrad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(70, 90, 110, 0.55)';
  ctx.lineWidth = 1.5 * S;
  ctx.stroke();

  // 横向加强筋
  ctx.strokeStyle = 'rgba(120, 140, 160, 0.4)';
  ctx.lineWidth = 1 * S;
  for (let i = 1; i < 5; i++) {
    const t = i / 5;
    const y = by + (ty - by) * t;
    const wt2 = wb + (wt - wb) * t;
    ctx.beginPath();
    ctx.moveTo(bx - wt2 / 2, y);
    ctx.lineTo(bx + wt2 / 2, y);
    ctx.stroke();
  }
}

/* ============================================================
   绘制：机舱和叶片
============================================================ */
function drawNacelle() {
  const hx = scene.hubX;
  const hy = scene.hubY;

  // 机舱（椭圆）
  ctx.save();
  const ng = ctx.createLinearGradient(hx - 20 * S, 0, hx + 20 * S, 0);
  ng.addColorStop(0, '#c8d0d8');
  ng.addColorStop(0.5, '#eef2f6');
  ng.addColorStop(1, '#8a94a0');
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.ellipse(hx, hy, 22 * S, 16 * S, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(70, 90, 110, 0.55)';
  ctx.lineWidth = 1.5 * S;
  ctx.stroke();

  // 机舱细节
  ctx.beginPath();
  ctx.ellipse(hx, hy - 2 * S, 14 * S, 4 * S, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(120, 140, 160, 0.5)';
  ctx.lineWidth = 1 * S;
  ctx.stroke();

  ctx.restore();
}

function drawBlades() {
  const hx = scene.hubX;
  const hy = scene.hubY;
  const len = scene.bladeLen;
  const n = state.bladeCount;

  // 叶片宽度：数量越多，每片越窄
  const bladeWidth = n === 3 ? 18 * S :
                     n === 4 ? 15 * S : 11 * S;

  // 拖尾（快速旋转时留下圆环）
  if (state.omega > 3) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(hx, hy, len * 0.92, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + Math.min(0.28, (state.omega - 3) * 0.05) + ')';
    ctx.lineWidth = 3 * S;
    ctx.stroke();
    ctx.restore();
  }

  for (let i = 0; i < n; i++) {
    const angle = state.bladeRotation + (Math.PI * 2 / n) * i;

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(angle);

    // 叶片形状（从中心向外的细长形状）
    ctx.beginPath();
    ctx.moveTo(0, -bladeWidth * 0.35);
    ctx.quadraticCurveTo(len * 0.5, -bladeWidth * 0.85, len * 0.92, -bladeWidth * 0.32);
    ctx.quadraticCurveTo(len * 0.98, 0, len * 0.92, bladeWidth * 0.32);
    ctx.quadraticCurveTo(len * 0.5, bladeWidth * 0.85, 0, bladeWidth * 0.35);
    ctx.closePath();

    const bladeGrad = ctx.createLinearGradient(0, -bladeWidth, 0, bladeWidth);
    bladeGrad.addColorStop(0, '#ffffff');
    bladeGrad.addColorStop(0.5, '#eef2f6');
    bladeGrad.addColorStop(1, '#b0b8c0');
    ctx.fillStyle = bladeGrad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(120, 140, 160, 0.6)';
    ctx.lineWidth = 1.2 * S;
    ctx.stroke();

    // 叶尖的红色标记（便于看出旋转）
    ctx.beginPath();
    ctx.arc(len * 0.9, 0, bladeWidth * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();

    ctx.restore();
  }

  // 轮毂中心
  ctx.beginPath();
  ctx.arc(hx, hy, 8 * S, 0, Math.PI * 2);
  const hubGrad = ctx.createRadialGradient(hx - 3 * S, hy - 3 * S, 1, hx, hy, 8 * S);
  hubGrad.addColorStop(0, '#ffffff');
  hubGrad.addColorStop(1, '#6a7480');
  ctx.fillStyle = hubGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(50, 70, 90, 0.6)';
  ctx.lineWidth = 1.5 * S;
  ctx.stroke();
}

/* ============================================================
   绘制：风线
============================================================ */
function drawWindLines() {
  for (const w of windLines) {
    ctx.save();
    ctx.globalAlpha = w.life * 0.55;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2 * S;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.quadraticCurveTo(
      w.x + w.len * 0.5, w.y - 4 * S,
      w.x + w.len, w.y
    );
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   绘制：灯泡
============================================================ */
function drawBulb() {
  const x = scene.bulbX;
  const y = scene.bulbY;
  const r = scene.bulbR;
  const lit = state.bulbLit;

  // 底座阴影
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  ctx.ellipse(x + 4 * S, y + r * 1.3, r * 0.9, r * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // 光晕（点亮时）
  if (lit > 0.02) {
    const pulse = 1 + Math.sin(time * 6) * 0.06;
    const glowR = r * (2.4 + lit * 2) * pulse;
    const gg = ctx.createRadialGradient(x, y, r * 0.3, x, y, glowR);
    gg.addColorStop(0, 'rgba(255, 240, 160, ' + (0.7 * lit) + ')');
    gg.addColorStop(0.4, 'rgba(255, 210, 80, ' + (0.3 * lit) + ')');
    gg.addColorStop(1, 'rgba(255, 200, 40, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fill();
  }

  // 灯泡玻璃
  const glassGrad = ctx.createRadialGradient(
    x - r * 0.32, y - r * 0.35, r * 0.1,
    x, y, r
  );
  if (lit > 0.1) {
    glassGrad.addColorStop(0, 'rgba(255, 255, 220, ' + (0.5 + lit * 0.5) + ')');
    glassGrad.addColorStop(0.5, 'rgba(255, 235, 140, ' + (0.6 + lit * 0.4) + ')');
    glassGrad.addColorStop(1, 'rgba(255, 200, 60, ' + (0.7 + lit * 0.3) + ')');
  } else {
    glassGrad.addColorStop(0, 'rgba(200, 225, 245, 0.5)');
    glassGrad.addColorStop(1, 'rgba(140, 170, 200, 0.4)');
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = glassGrad;
  ctx.fill();

  ctx.strokeStyle = lit > 0.4
    ? 'rgba(255, 240, 180, ' + (0.7 + lit * 0.3) + ')'
    : 'rgba(180, 200, 220, 0.7)';
  ctx.lineWidth = 2.5 * S;
  ctx.stroke();

  // 灯丝
  const filGrad = ctx.createLinearGradient(x, y - r * 0.5, x, y + r * 0.5);
  if (lit > 0.4) {
    filGrad.addColorStop(0, '#fff7c4');
    filGrad.addColorStop(0.5, '#ffd54f');
    filGrad.addColorStop(1, '#ffb055');
  } else {
    filGrad.addColorStop(0, '#5a6580');
    filGrad.addColorStop(1, '#3a4258');
  }
  ctx.strokeStyle = filGrad;
  ctx.lineWidth = 2.5 * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 7 * S, y - 9 * S);
  ctx.lineTo(x - 3 * S, y + 5 * S);
  ctx.lineTo(x + 3 * S, y + 5 * S);
  ctx.lineTo(x + 7 * S, y - 9 * S);
  ctx.stroke();

  // 灯座
  const baseY = y + r * 0.92;
  ctx.fillStyle = '#9aa5b8';
  roundRect(x - 12 * S, baseY - 3 * S, 24 * S, 12 * S, 3 * S);
  ctx.fill();

  ctx.fillStyle = '#b8c2d4';
  roundRect(x - 8 * S, y + r * 0.72, 16 * S, r * 0.28, 2 * S);
  ctx.fill();

  // 高光
  ctx.beginPath();
  ctx.arc(x - r * 0.3, y - r * 0.36, r * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.4 + lit * 0.5) + ')';
  ctx.fill();
}

/* ============================================================
   绘制：火花
============================================================ */
function drawSparks() {
  for (const s of sparks) {
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.translate(s.x, s.y);
    drawStar(0, 0, s.size, s.size * 0.42, 5);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.restore();
  }
}

function drawStar(cx, cy, outer, inner, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / points) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* ============================================================
   工具
============================================================ */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ============================================================
   渲染
============================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawSun();
  drawClouds();
  drawBirds();
  drawWindLines();
  drawGround();
  drawTower();
  drawNacelle();
  drawBlades();
  drawBulb();
  drawSparks();
}

/* ============================================================
   事件绑定
============================================================ */
windSlider.addEventListener('input', function (e) {
  initAudio();
  state.wind = +e.target.value / 100;
  updateWindLabel();
  sfxClick();
});

angleSlider.addEventListener('input', function (e) {
  initAudio();
  state.bladeAngle = +e.target.value;
  angleValEl.textContent = state.bladeAngle + '°';
  sfxClick();
});

bladeBtns.forEach(function (btn) {
  btn.addEventListener('click', function () {
    initAudio();
    bladeBtns.forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.bladeCount = +btn.dataset.n;
    sfxClick();
  });
});

function updateWindLabel() {
  const w = state.wind;
  windValEl.textContent =
    w < 0.1 ? '无风' :
    w < 0.3 ? '微风' :
    w < 0.55 ? '中' :
    w < 0.8 ? '大' : '狂风';
  windSlider.value = Math.round(state.wind * 100);
}

canvas.addEventListener('dblclick', function (e) { e.preventDefault(); });

/* ============================================================
   启动
============================================================ */
resize();

// 默认 3 片叶片高亮
bladeBtns.forEach(function (b) {
  if (+b.dataset.n === 3) b.classList.add('active');
});

// 初始化滑块
windSlider.value = Math.round(state.wind * 100);
angleSlider.value = state.angle;
angleValEl.textContent = state.bladeAngle + '°';
updateWindLabel();

window.addEventListener('resize', function () {
  resize();
  render();
});

if (window.ResizeObserver) {
  new ResizeObserver(function () {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    if (cw > 0 && ch > 0 && (Math.abs(cw - W) > 1 || Math.abs(ch - H) > 1)) {
      resize();
      render();
    }
  }).observe(canvas);
}

render();
requestAnimationFrame(function () {
  resize();
  render();
});

gsap.ticker.add(function (t, deltaTime) {
  const dt = Math.min(deltaTime || 16, 50) / 1000;
  update(dt);
  render();
});
</script>
