<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物分类大挑战 · 它们是谁的家人</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, #16233c 0%, #080e1a 55%, #03060c 100%);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .stage{width:min(100%,1180px);}
  canvas{
    display:block;width:100%;height:auto;border-radius:22px;
    box-shadow:0 26px 80px rgba(0,0,0,.72), 0 0 0 1px rgba(120,170,255,.10) inset;
    touch-action:none;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  'use strict';

  const W = 960, H = 660;
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp  = (a, b, t) => a + (b - a) * t;

  function roundRect(x, y, w, h, r){
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  /* =========================================================
     1. 分类定义
     ========================================================= */
  const CATEGORIES = [
    { id:'mammal', name:'哺乳类', color:'#ff9f68', dark:'#8a4210',
      desc:'有毛 · 胎生 · 哺乳' },
    { id:'bird',   name:'鸟类',   color:'#8ecfff', dark:'#1c548a',
      desc:'有羽毛 · 有喙 · 卵生' },
    { id:'fish',   name:'鱼类',   color:'#6ee7c8', dark:'#0f6a56',
      desc:'有鳞 · 用鳃呼吸' },
    { id:'insect', name:'昆虫',   color:'#c4a8ff', dark:'#4a2a8a',
      desc:'6条腿 · 身体分3段' },
    { id:'other',  name:'其他无脊椎', color:'#ffb8d8', dark:'#8a2a5a',
      desc:'没有脊椎骨' }
  ];

  /* =========================================================
     2. 动物数据
     ========================================================= */
  const ANIMALS = [
    { id:'dog',    name:'狗',   cat:'mammal', draw:drawDog,
      tip:'狗有毛、胎生、用乳汁喂宝宝，是哺乳动物。' },
    { id:'cat',    name:'猫',   cat:'mammal', draw:drawCat,
      tip:'猫有毛、胎生、哺乳，是哺乳动物。' },
    { id:'eleph',  name:'大象', cat:'mammal', draw:drawElephant,
      tip:'大象有毛（稀疏）、胎生、哺乳，是哺乳动物。' },
    { id:'rabbit', name:'兔子', cat:'mammal', draw:drawRabbit,
      tip:'兔子有毛、胎生、哺乳，是哺乳动物。' },
    { id:'dolphin',name:'海豚', cat:'mammal', draw:drawDolphin, myth:true,
      tip:'海豚虽然生活在海里，但它用肺呼吸、胎生、哺乳，是哺乳动物，不是鱼！' },
    { id:'bat',    name:'蝙蝠', cat:'mammal', draw:drawBat, myth:true,
      tip:'蝙蝠会飞，但它有毛、胎生、哺乳，是哺乳动物，不是鸟！' },
    { id:'sparrow',name:'麻雀', cat:'bird',   draw:drawSparrow,
      tip:'麻雀有羽毛、有喙、卵生，是鸟类。' },
    { id:'eagle',  name:'老鹰', cat:'bird',   draw:drawEagle,
      tip:'老鹰有羽毛、有喙、卵生，是鸟类。' },
    { id:'penguin',name:'企鹅', cat:'bird',   draw:drawPenguin, myth:true,
      tip:'企鹅虽然不会飞、会游泳，但它有羽毛、卵生，是鸟类！' },
    { id:'goldfish',name:'金鱼',cat:'fish',   draw:drawGoldfish,
      tip:'金鱼有鳞、用鳃呼吸、卵生，是鱼类。' },
    { id:'shark',  name:'鲨鱼', cat:'fish',   draw:drawShark,
      tip:'鲨鱼有鳞（盾鳞）、用鳃呼吸，是鱼类。' },
    { id:'butterfly',name:'蝴蝶',cat:'insect',draw:drawButterfly,
      tip:'蝴蝶有6条腿、身体分头/胸/腹三段，是昆虫。' },
    { id:'ant',    name:'蚂蚁', cat:'insect', draw:drawAnt,
      tip:'蚂蚁有6条腿、身体分三段，是昆虫。' },
    { id:'spider', name:'蜘蛛', cat:'other',  draw:drawSpider, myth:true,
      tip:'蜘蛛有8条腿、身体分两段，不是昆虫，是其他无脊椎动物！' },
    { id:'worm',   name:'蚯蚓', cat:'other',  draw:drawWorm,
      tip:'蚯蚓身体柔软、没有骨头、没有腿，是其他无脊椎动物。' },
    { id:'snail',  name:'蜗牛', cat:'other',  draw:drawSnail,
      tip:'蜗牛有壳、身体柔软、没有骨头，是其他无脊椎动物。' }
  ];

  /* =========================================================
     3. 布局常量
     ========================================================= */
  const BOX_Y      = 92;
  const BOX_H      = 122;
  const BOX_W      = 174;
  const BOX_GAP    = 12;
  const BOX_TOTAL  = CATEGORIES.length * BOX_W + (CATEGORIES.length - 1) * BOX_GAP;
  const BOX_X0     = (W - BOX_TOTAL) / 2;

  const CARD_W     = 80;
  const CARD_H     = 92;
  const ROW1_Y     = 400;
  const ROW2_Y     = 520;
  const COL_STEP   = 112;
  const COL_X0     = (W - (8 - 1) * COL_STEP - CARD_W) / 2 + CARD_W / 2;

  /* =========================================================
     4. 初始化卡片
     ========================================================= */
  const cards = [];

  function buildCards(){
    const list = ANIMALS.slice();
    for (let i = list.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }

    list.forEach((a, i) => {
      const col = i % 8;
      const row = Math.floor(i / 8);
      const hx  = COL_X0 + col * COL_STEP;
      const hy  = row === 0 ? ROW1_Y : ROW2_Y;

      cards.push({
        id: a.id, name: a.name, cat: a.cat, draw: a.draw,
        tip: a.tip, myth: !!a.myth,
        homeX: hx, homeY: hy,
        x: hx, y: hy,
        scale: 1,
        alpha: 1,
        placed: false,
        place: null,
        shakeX: 0,
        glow: 0,
        bob: Math.random() * Math.PI * 2
      });
    });
  }
  buildCards();

  /* =========================================================
     5. 槽位工具
     ========================================================= */
  function boxRect(catIndex){
    const x = BOX_X0 + catIndex * (BOX_W + BOX_GAP);
    return { x, y: BOX_Y, w: BOX_W, h: BOX_H };
  }
  function catIndexById(id){ return CATEGORIES.findIndex(c => c.id === id); }
  function catById(id){ return CATEGORIES.find(c => c.id === id); }

  function slotPos(boxIndex, slotIndex){
    const r = boxRect(boxIndex);
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2 + 12;
    const dx = 42, dy = 36;
    const col = slotIndex % 2;
    const row = Math.floor(slotIndex / 2);
    return {
      x: cx + (col === 0 ? -dx : dx),
      y: cy + (row === 0 ? -dy : dy)
    };
  }

  function usedSlots(boxId){
    return cards.filter(c => c.placed && c.place && c.place.boxId === boxId).length;
  }

  /* =========================================================
     6. 拖拽交互
     ========================================================= */
  let dragging = null;
  let dragOffset = { x: 0, y: 0 };
  let hoverBoxId = null;

  function getPos(e){
    const r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top)  * (H / r.height)
    };
  }

  function hitCard(x, y){
    for (let i = cards.length - 1; i >= 0; i--){
      const c = cards[i];
      if (c.placed) continue;
      const hw = CARD_W / 2 * c.scale;
      const hh = CARD_H / 2 * c.scale;
      if (x > c.x - hw && x < c.x + hw && y > c.y - hh && y < c.y + hh){
        return c;
      }
    }
    return null;
  }

  function hitBox(x, y){
    for (let i = 0; i < CATEGORIES.length; i++){
      const r = boxRect(i);
      if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h){
        return CATEGORIES[i].id;
      }
    }
    return null;
  }

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    const p = getPos(e);
    const c = hitCard(p.x, p.y);
    if (c){
      dragging = c;
      dragOffset.x = c.x - p.x;
      dragOffset.y = c.y - p.y;
      const idx = cards.indexOf(c);
      cards.splice(idx, 1);
      cards.push(c);
      gsap.to(c, { scale: 1.12, duration: 0.18, ease: 'back.out(2)' });
    }
  });

  cv.addEventListener('pointermove', e => {
    const p = getPos(e);
    if (dragging){
      dragging.x = p.x + dragOffset.x;
      dragging.y = p.y + dragOffset.y;
      hoverBoxId = hitBox(p.x, p.y);
    }
  });

  /* ---------- 修正点：把用户拖入的框传给 wrongDrop ---------- */
  cv.addEventListener('pointerup', e => {
    if (!dragging) return;
    const p = getPos(e);
    const bid = hitBox(p.x, p.y);      // 用户实际拖入的框
    const c = dragging;
    dragging = null;
    hoverBoxId = null;

    if (bid){
      if (bid === c.cat){
        placeCard(c, bid);
      } else {
        wrongDrop(c, bid);             // ★ 传入 bid
      }
    } else {
      gsap.to(c, {
        x: c.homeX, y: c.homeY, scale: 1,
        duration: 0.45, ease: 'power2.out'
      });
    }
  });

  cv.addEventListener('pointercancel', () => {
    if (dragging){
      const c = dragging;
      dragging = null;
      gsap.to(c, { x: c.homeX, y: c.homeY, scale: 1, duration: 0.4 });
    }
  });

  /* =========================================================
     7. 放置逻辑
     ========================================================= */
  let correctCount = 0;
  let wrongCount   = 0;
  let toast = null;

  function showToast(text, color){
    toast = { text, color, life: 0 };
  }

  function placeCard(c, boxId){
    const bi = catIndexById(boxId);
    const slot = usedSlots(boxId);
    const pos = slotPos(bi, slot);

    c.placed = true;
    c.place = { boxId, slotIndex: slot };

    gsap.to(c, {
      x: pos.x, y: pos.y,
      scale: 0.44,
      duration: 0.52,
      ease: 'back.in(1.4)',
      onStart: () => { c.glow = 1; }
    });

    correctCount++;
    const cat = CATEGORIES[bi];
    showToast(`✔ ${c.name} → ${cat.name}　${c.tip}`, '#7cf0b8');

    if (correctCount === ANIMALS.length){
      gsap.delayedCall(0.7, () => {
        showToast('🎉 全部答对！你已经是动物分类小专家啦！', '#ffd76b');
      });
    }
  }

  /* ---------- 修正点：wrongDrop 接收 wrongBoxId ---------- */
  function wrongDrop(c, wrongBoxId){
    wrongCount++;

    // 抖动
    const origX = c.x;
    gsap.timeline()
      .to(c, { x: origX + 9, duration: 0.06, ease: 'power2.in' })
      .to(c, { x: origX - 9, duration: 0.06, ease: 'power2.in' })
      .to(c, { x: origX + 7, duration: 0.06, ease: 'power2.in' })
      .to(c, { x: origX - 7, duration: 0.06, ease: 'power2.in' })
      .to(c, { x: origX,     duration: 0.08 });

    gsap.to(c, { scale: 1, duration: 0.2 });

    // ★ 用用户拖入的框（wrongBoxId）生成提示
    const wrongCat = catById(wrongBoxId);
    const wrongName = wrongCat ? wrongCat.name : '这一类';

    showToast(
      `✘ ${c.name} 不属于「${wrongName}」。${c.tip}`,
      '#ff9a9a'
    );

    // 回原位
    gsap.to(c, {
      x: c.homeX, y: c.homeY, scale: 1,
      duration: 0.55, ease: 'power2.out', delay: 0.35
    });
  }

  /* =========================================================
     8. 绘制：背景 / 标题
     ========================================================= */
  function drawBackground(t){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#0c1626');
    g.addColorStop(0.5,  '#101f38');
    g.addColorStop(1,    '#0a1526');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const rg = ctx.createRadialGradient(W / 2, 260, 40, W / 2, 260, 520);
    rg.addColorStop(0,   'rgba(90,160,235,0.10)');
    rg.addColorStop(0.5, 'rgba(70,140,220,0.04)');
    rg.addColorStop(1,   'rgba(70,140,220,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHeader(){
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    ctx.font = '700 27px ' + FONT;
    ctx.fillStyle = '#eaf4ff';
    ctx.fillText('动物分类大挑战', 40, 44);

    ctx.font = '400 14px ' + FONT;
    ctx.fillStyle = 'rgba(150,188,230,0.82)';
    ctx.fillText('把下面的动物拖到正确的分类框里', 40, 72);

    ctx.textAlign = 'right';
    ctx.font = '700 16px ' + FONT;
    ctx.fillStyle = '#7cf0b8';
    ctx.fillText('✔ ' + correctCount, W - 130, 46);

    ctx.fillStyle = '#ff9a9a';
    ctx.fillText('✘ ' + wrongCount, W - 40, 46);

    ctx.restore();
  }

  /* =========================================================
     9. 绘制：分类框
     ========================================================= */
  function drawBoxes(t){
    CATEGORIES.forEach((cat, i) => {
      const r = boxRect(i);
      const isHover = hoverBoxId === cat.id;

      ctx.save();
      roundRect(r.x, r.y, r.w, r.h, 16);
      const bg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      bg.addColorStop(0, isHover ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.045)');
      bg.addColorStop(1, isHover ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.012)');
      ctx.fillStyle = bg;
      ctx.fill();

      ctx.strokeStyle = isHover ? cat.color : 'rgba(255,255,255,0.14)';
      ctx.lineWidth = isHover ? 2.2 : 1.3;
      ctx.stroke();

      roundRect(r.x, r.y, r.w, 5, 2.5);
      ctx.fillStyle = cat.color;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 16px ' + FONT;
      ctx.fillStyle = cat.color;
      ctx.fillText(cat.name, r.x + r.w / 2, r.y + 24);

      ctx.font = '400 11px ' + FONT;
      ctx.fillStyle = 'rgba(180,205,235,0.7)';
      ctx.fillText(cat.desc, r.x + r.w / 2, r.y + 45);

      ctx.restore();
    });
  }

  /* =========================================================
     10. 绘制：卡片
     ========================================================= */
  function drawCard(c, t){
    const s = c.scale;
    const bobY = c.placed ? 0 : Math.sin(t * 1.6 + c.bob) * 2.2;

    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.translate(c.x, c.y + bobY);
    ctx.scale(s, s);

    const hw = CARD_W / 2, hh = CARD_H / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 6;
    roundRect(-hw, -hh, CARD_W, CARD_H, 12);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    ctx.restore();

    roundRect(-hw, -hh, CARD_W, CARD_H, 12);
    const bg = ctx.createLinearGradient(0, -hh, 0, hh);
    bg.addColorStop(0,   '#25364e');
    bg.addColorStop(0.5, '#1a2a3f');
    bg.addColorStop(1,   '#0f1b2c');
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.strokeStyle = c.glow > 0.01
      ? `rgba(124,240,184,${c.glow})`
      : 'rgba(150,190,235,0.24)';
    ctx.lineWidth = c.glow > 0.01 ? 2.2 : 1.3;
    ctx.stroke();

    if (c.myth && !c.placed){
      ctx.beginPath();
      ctx.arc(hw - 12, -hh + 12, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,215,107,0.92)';
      ctx.fill();
      ctx.font = '700 12px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#3a2600';
      ctx.fillText('?', hw - 12, -hh + 13);
    }

    ctx.save();
    ctx.translate(0, -8);
    ctx.scale(0.9, 0.9);
    c.draw(ctx);
    ctx.restore();

    ctx.font = '600 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(230,242,255,0.95)';
    ctx.fillText(c.name, 0, hh - 15);

    ctx.restore();
  }

  /* =========================================================
     11. 动物矢量图
     ========================================================= */
  function drawDog(){
    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath(); ctx.ellipse(-16, -14, 8, 12, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 16, -14, 8, 12,  0.4, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, 22);
    g.addColorStop(0, '#d9a86a');
    g.addColorStop(1, '#a06b30');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1c10';
    ctx.beginPath(); ctx.arc(-6, -3, 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 6, -3, 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e1410';
    ctx.beginPath(); ctx.ellipse(0, 6, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e1410';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(0, 13);
    ctx.moveTo(0, 13); ctx.arc(-4, 13, 4, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 13); ctx.arc(4, 13, 4, 0, Math.PI); ctx.stroke();
  }

  function drawCat(){
    ctx.fillStyle = '#e08b3a';
    ctx.beginPath(); ctx.moveTo(-16, -10); ctx.lineTo(-8, -24); ctx.lineTo(-2, -12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 16, -10); ctx.lineTo( 8, -24); ctx.lineTo( 2, -12); ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(-5, -5, 2, 0, 0, 22);
    g.addColorStop(0, '#ffc57a');
    g.addColorStop(1, '#d98b2e');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1c10';
    ctx.beginPath(); ctx.arc(-6, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 6, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c04a6a';
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-2.5, 8); ctx.lineTo(2.5, 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-8, 7); ctx.lineTo(-20, 4);
    ctx.moveTo(-8, 9); ctx.lineTo(-20, 10);
    ctx.moveTo( 8, 7); ctx.lineTo( 20, 4);
    ctx.moveTo( 8, 9); ctx.lineTo( 20, 10);
    ctx.stroke();
  }

  function drawElephant(){
    const ge = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
    ge.addColorStop(0, '#a8b8cc');
    ge.addColorStop(1, '#6a7a90');
    ctx.fillStyle = ge;
    ctx.beginPath(); ctx.ellipse(-18, -2, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 18, -2, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(-4, -6, 3, 0, 0, 22);
    g.addColorStop(0, '#c8d6e8');
    g.addColorStop(1, '#8898b0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -2, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a3040';
    ctx.beginPath(); ctx.arc(-6, -6, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 6, -6, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8898b0';

  function drawPenguin(){

  function drawGoldfish(){

  function drawShark(){
    const g = ctx.createLinearGradient(0, -12, 0, 14);

  function drawButterfly(){
    const g1 = ctx.createRadialGradient(-8, -4, 2, -8, -4, 16);
    g1.addColorStop(0, '#ffd070');
    g1.addColorStop(1, '#ff6a3a');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.ellipse(-11, -6, 12, 10, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 11, -6, 12, 10,  0.4, 0, Math.PI * 2); ctx.fill();
    const g2 = ctx.createRadialGradient(-8, 8, 2, -8, 8, 12);
    g2.addColorStop(0, '#ff9a6a');
    g2.addColorStop(1, '#d040a0');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(-8, 8, 8, 8, 0.3, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#2a1c30';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-1, -12); ctx.quadraticCurveTo(-6, -20, -8, -22);
    ctx.moveTo( 1, -12); ctx.quadraticCurveTo( 6, -20,  8, -22);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(-8, -22, 1.6, 0, Math.PI * 2); ctx.fill();

  function drawAnt(){
    ctx.strokeStyle = '#1a1418';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++){
      const y = -2 + i * 7;
      ctx.beginPath();
      ctx.moveTo(-2, y);
      ctx.quadraticCurveTo(-12, y - 4, -16, y + 6);
      ctx.moveTo( 2, y);
      ctx.quadraticCurveTo( 12, y - 4, 16, y + 6);
      ctx.stroke();
    }
    ctx.fillStyle = '#2a1c24';
    ctx.beginPath(); ctx.arc(0, -10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 12, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1c24';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-1, -14); ctx.quadraticCurveTo(-6, -20, -4, -24);
    ctx.moveTo( 1, -14); ctx.quadraticCurveTo( 6, -20,  4, -24);
    ctx.stroke();
    ctx.fillStyle = '#ffd76b';
    ctx.beginPath(); ctx.arc(-2, -11, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 2, -11, 1.2, 0, Math.PI * 2); ctx.fill();
  }

  function drawSpider(){
    ctx.strokeStyle = '#1a1418';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++){
      const y = -6 + i * 5;
      const spread = 12 + i * 2;
      ctx.beginPath();
      ctx.moveTo(-4, y);
      ctx.quadraticCurveTo(-spread, y - 4, -spread - 4, y + 6);
      ctx.moveTo( 4, y);
      ctx.quadraticCurveTo( spread, y - 4,  spread + 4, y + 6);
      ctx.stroke();
    }
    const g = ctx.createRadialGradient(-2, 6, 1, 0, 8, 12);
    g.addColorStop(0, '#4a3a48');
    g.addColorStop(1, '#1a141c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 9, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a2030';
    ctx.beginPath(); ctx.ellipse(0, -4, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd76b';
    ctx.beginPath(); ctx.arc(-2, -6, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 2, -6, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-3, -2, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 3, -2, 1.1, 0, Math.PI * 2); ctx.fill();
  }

  function drawWorm(){
    const g = ctx.createLinearGradient(0, -10, 0, 10);
    g.addColorStop(0, '#e8a8b8');
    g.addColorStop(1, '#b06078');
    ctx.strokeStyle = g;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-24, 4);
    ctx.bezierCurveTo(-14, -14, -4, 14, 6, -4);
    ctx.bezierCurveTo(14, -14, 20, 6, 26, 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,50,70,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++){
      const x = -20 + i * 8;
      ctx.beginPath();
      ctx.moveTo(x, -1);
      ctx.lineTo(x + 1, 5);
      ctx.stroke();
    }
  }

  function drawSnail(){
    ctx.fillStyle = '#e0c8a8';
    ctx.beginPath();
    ctx.moveTo(-20, 12);
    ctx.quadraticCurveTo(-16, 4, -6, 6);
    ctx.quadraticCurveTo(4, 8, 12, 12);
    ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(-2, 0, 1, -2, 0, 14);
    g.addColorStop(0, '#d8a060');
    g.addColorStop(0.6, '#a07030');
    g.addColorStop(1, '#6a4418');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(-2, -2, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,20,0.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 4; a += 0.15){
      const r = a * 1.1;
      const x = -2 + Math.cos(a) * r;
      const y = -2 + Math.sin(a) * r;
      if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#e0c8a8';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(10, 8); ctx.lineTo(14, 2);
    ctx.moveTo(13, 8); ctx.lineTo(16, 3);
    ctx.stroke();
    ctx.fillStyle = '#1a1418';
    ctx.beginPath(); ctx.arc(14, 1, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 2, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  /* =========================================================
     12. 提示条
     ========================================================= */
  function drawToast(){
    if (!toast) return;

    ctx.save();
    ctx.font = '500 14px ' + FONT;
    const padding = 24;
    const tw = ctx.measureText(toast.text).width;
    const bw = Math.min(W - 80, tw + padding * 2);
    const bh = 42;
    const bx = (W - bw) / 2;
    const by = 250;

    const a = Math.min(1, toast.life * 4);

    ctx.globalAlpha = a;
    roundRect(bx, by, bw, bh, 12);
    ctx.fillStyle = 'rgba(12,22,38,0.94)';
    ctx.fill();
    ctx.strokeStyle = toast.color;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = toast.color;
    ctx.fillText(toast.text, W / 2, by + bh / 2);

    ctx.restore();
  }

  /* =========================================================
     13. 底部说明
     ========================================================= */
  function drawFooter(){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '500 14px ' + FONT;
    ctx.fillStyle = 'rgba(168,200,235,0.85)';
    ctx.fillText('观察动物的身体特征：有没有毛？几条腿？用什么呼吸？', W / 2, 606);

    ctx.font = '400 13px ' + FONT;
    ctx.fillStyle = 'rgba(125,160,196,0.72)';
    ctx.fillText('带 ? 的动物，试试看它到底属于哪一类～', W / 2, 632);

    ctx.restore();
  }

  /* =========================================================
     14. 主循环
     ========================================================= */
  let lastTime = performance.now();
  let elapsed  = 0;

  function render(now){
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    elapsed += dt;

    if (toast){
      toast.life += dt * 0.5;
      if (toast.life > 2.6) toast = null;
    }

    cards.forEach(c => {
      if (c.glow > 0){
        c.glow = Math.max(0, c.glow - dt * 0.6);
      }
    });

    ctx.clearRect(0, 0, W, H);

    drawBackground(elapsed);
    drawHeader();
    drawBoxes(elapsed);

    cards.forEach(c => { if (c.placed) drawCard(c, elapsed); });
    cards.forEach(c => { if (!c.placed) drawCard(c, elapsed); });

    if (dragging){
      ctx.save();
      ctx.strokeStyle = 'rgba(124,240,184,0.7)';
      ctx.lineWidth = 2;
      roundRect(
        dragging.x - CARD_W / 2 * dragging.scale - 4,
        dragging.y - CARD_H / 2 * dragging.scale - 4,
        CARD_W * dragging.scale + 8,
        CARD_H * dragging.scale + 8,
        16
      );
      ctx.stroke();
      ctx.restore();
    }

    drawToast();
    drawFooter();

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

})();
</script>
