<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学实验室 · 互动课件合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #080c14;
    color: #fff;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; height: 100%; }

  /* ============ 侧边栏 ============ */
  .sidebar {
    width: 290px;
    flex: 0 0 290px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #0e1524 0%, #0a1018 100%);
    border-right: 1px solid rgba(255, 255, 255, 0.07);
    position: relative;
    z-index: 30;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
  }
  .brand-icon {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    border-radius: 13px;
    background: linear-gradient(135deg, #5eb3ff, #7fdd6e);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 20px rgba(94, 179, 255, 0.35);
  }
  .brand-text h1 { font-size: 16px; letter-spacing: 0.5px; font-weight: 800; }
  .brand-text p { font-size: 11.5px; color: #7a8ca6; margin-top: 3px; }

  .search-wrap { padding: 0 16px 12px; position: relative; }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 27px; top: 9px;
    font-size: 13px;
    opacity: 0.45;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.045);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.18s, background 0.18s;
  }
  .search-wrap input::placeholder { color: #5f7290; }
  .search-wrap input:focus {
    border-color: rgba(94, 179, 255, 0.6);
    background: rgba(94, 179, 255, 0.08);
  }

  .list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 10px 20px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.14) transparent;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
  }
  .list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }

  .group-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #5f7290;
    padding: 15px 10px 7px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    color: #a8c0e0;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .item .ic { font-size: 16px; width: 20px; flex: 0 0 20px; text-align: center; }
  .item .nm {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item:hover { background: rgba(94, 179, 255, 0.09); color: #e6f0ff; }
  .item.active {
    background: linear-gradient(135deg, rgba(94, 179, 255, 0.26), rgba(127, 221, 110, 0.15));
    color: #fff;
    font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(94, 179, 255, 0.32);
  }

  .empty-tip {
    padding: 30px 16px;
    text-align: center;
    font-size: 13px;
    color: #5f7290;
    line-height: 1.7;
  }

  .foot {
    padding: 10px 18px 14px;
    font-size: 11px;
    color: #46566e;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    text-align: center;
    letter-spacing: 0.3px;
  }
  .foot kbd {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-family: inherit;
    font-size: 10.5px;
    color: #8fa5c0;
  }

  /* ============ 右侧展示区 ============ */
  .viewer {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .toolbar {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: rgba(14, 21, 36, 0.92);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .tb-btn {
    width: 34px; height: 34px;
    flex: 0 0 34px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.05);
    color: #c8d8ea;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .tb-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.13); color: #fff; }
  .tb-btn:active:not(:disabled) { transform: translateY(1px); }
  .tb-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #toggle { display: none; }

  .crumb {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 600;
    color: #7d92ad;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .crumb b { color: #ffffff; }
  .crumb .dot { color: #46566e; margin: 0 8px; }

  .frame-wrap {
    flex: 1;
    position: relative;
    background: #050810;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #050810;
  }

  /* ============ 欢迎页 ============ */
  .welcome {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px 24px;
    text-align: center;
    background:
      radial-gradient(circle at 50% 32%, rgba(94, 179, 255, 0.12), transparent 62%),
      radial-gradient(circle at 78% 72%, rgba(127, 221, 110, 0.08), transparent 55%);
    z-index: 4;
    transition: opacity 0.25s;
  }
  .welcome-logo {
    width: 78px; height: 78px;
    border-radius: 24px;
    background: linear-gradient(135deg, #5eb3ff, #7fdd6e);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    box-shadow: 0 14px 44px rgba(94, 179, 255, 0.35);
    margin-bottom: 4px;
  }
  .welcome h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .welcome p {
    font-size: 14px;
    color: #7d92ad;
    line-height: 1.7;
    max-width: 440px;
  }
  .welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    justify-content: center;
    margin-top: 12px;
    max-width: 560px;
  }
  .chip {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #c8d8ea;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.16s;
  }
  .chip:hover {
    background: rgba(94, 179, 255, 0.16);
    border-color: rgba(94, 179, 255, 0.45);
    color: #fff;
    transform: translateY(-1px);
  }

  /* ============ 加载中 ============ */
  .loading {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(5, 8, 16, 0.92);
    color: #7d92ad;
    font-size: 13.5px;
    z-index: 6;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(94, 179, 255, 0.18);
    border-top-color: #5eb3ff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 移动端 ============ */
  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 25;
    backdrop-filter: blur(2px);
  }
  .backdrop.show { display: block; }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      flex-basis: 280px;
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
    }
    .sidebar.open { transform: translateX(0); }
    #toggle { display: flex; }
    .welcome-logo { width: 64px; height: 64px; font-size: 32px; border-radius: 20px; }
    .welcome h2 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ 左侧：实验目录 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🔬</div>
      <div class="brand-text">
        <h1>科学实验室</h1>
        <p>34 个互动小实验</p>
      </div>
    </div>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="搜索实验…" autocomplete="off">
    </div>

    <nav class="list" id="list"></nav>

    <div class="foot">
      <kbd>↑</kbd> <kbd>↓</kbd> 切换实验
    </div>
  </aside>

  <!-- ============ 右侧：展示区 ============ -->
  <main class="viewer">
    <div class="toolbar">
      <button class="tb-btn" id="toggle" title="展开目录">☰</button>
      <div class="crumb" id="crumb">选择一个实验开始 👈</div>
      <button class="tb-btn" id="reload" title="重新加载" disabled>🔄</button>
      <button class="tb-btn" id="open" title="在新窗口打开" disabled>↗</button>
    </div>

    <div class="frame-wrap">
      <!-- 欢迎页 -->
      <div class="welcome" id="welcome">
        <div class="welcome-logo">🔬</div>
        <h2>科学实验室</h2>
        <p>从左边目录里挑一个实验，右边就会打开它。<br>每个实验都可以用手拖、用按钮试，边玩边发现规律。</p>
        <div class="welcome-chips" id="chips"></div>
      </div>

      <iframe id="frame" src="about:blank" allow="fullscreen; autoplay" title="实验展示区"></iframe>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>正在打开实验…</div>
      </div>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>

<script>
/* ============================================================
   实验数据
   ============================================================ */
const DATA = [
  {
    group: "🌈 光",
    items: [
      { file: "彩虹实验室.html",       icon: "🌈", title: "彩虹实验室",       desc: "背对太阳喷水，就能看见彩虹" },
      { file: "光的颜色实验室.html",   icon: "🎨", title: "光的颜色实验室",   desc: "红绿蓝能混出什么颜色" },
      { file: "光的折射.html",         icon: "🥢", title: "光的折射",         desc: "筷子在水里怎么断了" },
      { file: "光和影子.html",         icon: "🌑", title: "光和影子",         desc: "光 · 物体 · 屏幕" },
      { file: "光线传播.html",         icon: "🪞", title: "镜子送光",         desc: "用镜子把光送到小熊那里" }
    ]
  },
  {
    group: "🔊 声音",
    items: [
      { file: "传声筒.html",           icon: "📞", title: "传声筒",           desc: "绳子绷紧了才听得见" },
      { file: "声音怎么来.html",       icon: "🥁", title: "声音怎么来",       desc: "鼓面上的小颗粒" },
      { file: "声音的高低与大小.html", icon: "📊", title: "声音的高低与大小", desc: "看得见的声波" },
      { file: "水瓶排笛.html",         icon: "🍶", title: "水瓶排笛",         desc: "水多水少，声音怎么会变" }
    ]
  },
  {
    group: "⚙️ 力与机械",
    items: [
      { file: "齿轮.html",             icon: "⚙️", title: "齿轮转啊转",       desc: "齿数 · 方向 · 速度" },
      { file: "神奇的滑轮.html",       icon: "🎡", title: "神奇的滑轮",       desc: "怎样拉起大石头" },
      { file: "跷跷板平衡.html",       icon: "⚖️", title: "跷跷板平衡",       desc: "怎样让两边一样重" },
      { file: "斜坡滚弹珠.html",       icon: "🎯", title: "斜坡滚弹珠",       desc: "怎样滚得远" },
      { file: "自制陀螺.html",         icon: "🌀", title: "自制陀螺",         desc: "转得稳又久" },
      { file: "造桥承重赛.html",       icon: "🌉", title: "造桥承重赛",       desc: "什么形状的桥最结实" },
      { file: "纸的力量.html",         icon: "📄", title: "纸的力量",         desc: "薄薄一张纸，能撑起多少本书" }
    ]
  },
  {
    group: "⚡ 电与磁",
    items: [
      { file: "电路迷宫.html",         icon: "💡", title: "电路迷宫",         desc: "怎样让灯泡亮起来" },
      { file: "磁铁的两极.html",       icon: "🧲", title: "磁铁的两极",       desc: "推开还是吸住" },
      { file: "磁铁好朋友.html",       icon: "🔗", title: "磁铁好朋友",       desc: "什么会被吸住" },
      { file: "静电实验室.html",       icon: "⚡", title: "静电实验室",       desc: "摩擦能让气球吸起纸片吗" },
      { file: "风车与风力发电.html",   icon: "🌬️", title: "风车与风力发电",   desc: "怎样让灯泡亮起来" }
    ]
  },
  {
    group: "💧 水",
    items: [
      { file: "沉与浮.html",           icon: "🫧", title: "沉与浮",           desc: "什么会浮起来" },
      { file: "毛细现象.html",         icon: "💧", title: "毛细现象",         desc: "水自己会往上爬" },
      { file: "毛细现象2.html",        icon: "🌿", title: "毛细自动浇水装置", desc: "棉绳把水送上花盆" },
      { file: "溶解实验室.html",       icon: "🧂", title: "溶解实验室",       desc: "糖和盐去哪儿了" },
      { file: "水的三态变化.html",     icon: "❄️", title: "水的三态变化",     desc: "冰 · 水 · 水蒸气" },
      { file: "太阳照着大海.html",     icon: "☀️", title: "水循环",           desc: "太阳 · 蒸发 · 云 · 雨" }
    ]
  },
  {
    group: "🌬️ 空气",
    items: [
      { file: "空气在哪里.html",       icon: "🫙", title: "空气在哪里",       desc: "杯子里的秘密" },
      { file: "空气阻力.html",         icon: "🪶", title: "空气阻力",         desc: "物体为什么不是同时落地" },
      { file: "气球火箭.html",         icon: "🎈", title: "气球火箭",         desc: "空气往后跑，气球往前飞" }
    ]
  },
  {
    group: "🌱 生命",
    items: [
      { file: "毛毛虫变蝴蝶.html",     icon: "🦋", title: "毛毛虫变蝴蝶",     desc: "蝴蝶的一生" },
      { file: "种子的一生.html",       icon: "🌱", title: "种子的一生",       desc: "水 · 阳光 · 空气" }
    ]
  },
  {
    group: "🌍 地球",
    items: [
      { file: "岩石一家人.html",       icon: "🪨", title: "岩石一家人",       desc: "石头 · 沙子 · 泥土" },
      { file: "月相变化.html",         icon: "🌙", title: "月相变化",         desc: "月亮为什么会变形状" }
    ]
  }
];

/* ============================================================
   元素引用
   ============================================================ */
const listEl    = document.getElementById("list");
const searchEl  = document.getElementById("search");
const frameEl   = document.getElementById("frame");
const welcomeEl = document.getElementById("welcome");
const loadingEl = document.getElementById("loading");
const crumbEl   = document.getElementById("crumb");
const reloadBtn = document.getElementById("reload");
const openBtn   = document.getElementById("open");
const toggleBtn = document.getElementById("toggle");
const sidebarEl = document.getElementById("sidebar");
const backdrop  = document.getElementById("backdrop");
const chipsEl   = document.getElementById("chips");

let currentItem = null;
let pendingLoad = false;
let loadTimer = null;

/* ============================================================
   渲染目录
   ============================================================ */
function buildList(filter) {
  const q = (filter || "").trim().toLowerCase();
  listEl.innerHTML = "";

  let shown = 0;

  DATA.forEach(function (group) {
    const matched = group.items.filter(function (it) {
      if (!q) return true;
      return it.title.toLowerCase().indexOf(q) > -1 ||
             (it.desc || "").toLowerCase().indexOf(q) > -1 ||
             it.file.toLowerCase().indexOf(q) > -1;
    });

    if (!matched.length) return;

    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = group.group;
    listEl.appendChild(title);

    matched.forEach(function (it) {
      shown++;
      const el = document.createElement("div");
      el.className = "item";
      el.dataset.file = it.file;
      if (currentItem && currentItem.file === it.file) el.classList.add("active");
      el.title = it.desc || it.title;

      const ic = document.createElement("span");
      ic.className = "ic";
      ic.textContent = it.icon;

      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = it.title;

      el.appendChild(ic);
      el.appendChild(nm);
      el.addEventListener("click", function () { selectItem(it); });
      listEl.appendChild(el);
    });
  });

  if (shown === 0) {
    const tip = document.createElement("div");
    tip.className = "empty-tip";
    tip.textContent = "没有找到相关实验 🤔\n换个关键词试试吧";
    tip.style.whiteSpace = "pre-line";
    listEl.appendChild(tip);
  }
}

/* ============================================================
   选中实验
   ============================================================ */
function selectItem(item) {
  currentItem = item;

  // 高亮
  const items = listEl.querySelectorAll(".item");
  for (let i = 0; i < items.length; i++) {
    items[i].classList.toggle("active", items[i].dataset.file === item.file);
  }

  // 顶部面包屑
  crumbEl.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = item.icon + " ";
  const b = document.createElement("b");
  b.textContent = item.title;
  crumbEl.appendChild(span);
  crumbEl.appendChild(b);
  if (item.desc) {
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.textContent = "·";
    crumbEl.appendChild(dot);
    const d = document.createElement("span");
    d.textContent = item.desc;
    crumbEl.appendChild(d);
  }

  // 按钮可用
  reloadBtn.disabled = false;
  openBtn.disabled = false;

  // 隐藏欢迎页，显示加载
  welcomeEl.style.opacity = "0";
  setTimeout(function () { welcomeEl.style.display = "none"; }, 200);

  loadingEl.classList.add("show");

  // 加载 iframe
  pendingLoad = true;
  frameEl.src = item.file;

  // 安全兜底：8 秒后无论如何都隐藏 loading
  clearTimeout(loadTimer);
  loadTimer = setTimeout(function () {
    if (pendingLoad) {
      pendingLoad = false;
      loadingEl.classList.remove("show");
    }
  }, 8000);

  // 记忆
  try { localStorage.setItem("sci-lab-current", item.file); } catch (e) {}

  // 移动端自动收起侧栏
  if (window.innerWidth <= 860) closeSidebar();

  // 让选中项滚动到可见区域
  const activeEl = listEl.querySelector(".item.active");
  if (activeEl && activeEl.scrollIntoView) {
    activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

/* iframe 加载完成 */
frameEl.addEventListener("load", function () {
  if (!pendingLoad) return;
  pendingLoad = false;
  clearTimeout(loadTimer);
  loadingEl.classList.remove("show");
});

/* ============================================================
   搜索
   ============================================================ */
let searchTimer = null;
searchEl.addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    buildList(searchEl.value);
  }, 120);
});

/* ============================================================
   工具栏按钮
   ============================================================ */
reloadBtn.addEventListener("click", function () {
  if (!currentItem) return;
  pendingLoad = true;
  loadingEl.classList.add("show");
  // 加时间戳强制刷新
  frameEl.src = currentItem.file + "?t=" + Date.now();
  clearTimeout(loadTimer);
  loadTimer = setTimeout(function () {
    if (pendingLoad) { pendingLoad = false; loadingEl.classList.remove("show"); }
  }, 8000);
});

openBtn.addEventListener("click", function () {
  if (!currentItem) return;
  window.open(currentItem.file, "_blank");
});

toggleBtn.addEventListener("click", function () {
  sidebarEl.classList.toggle("open");
  backdrop.classList.toggle("show", sidebarEl.classList.contains("open"));
});

backdrop.addEventListener("click", closeSidebar);

function closeSidebar() {
  sidebarEl.classList.remove("open");
  backdrop.classList.remove("show");
}

/* ============================================================
   键盘上下切换
   ============================================================ */
let keyLock = false;
document.addEventListener("keydown", function (e) {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  if (keyLock) return;

  const items = listEl.querySelectorAll(".item");
  if (!items.length) return;

  e.preventDefault();

  let idx = -1;
  for (let i = 0; i < items.length; i++) {
    if (items[i].classList.contains("active")) { idx = i; break; }
  }

  if (e.key === "ArrowDown") idx = (idx + 1) % items.length;
  else idx = (idx - 1 + items.length) % items.length;

  items[idx].click();

  // 防止长按刷屏
  keyLock = true;
  setTimeout(function () { keyLock = false; }, 180);
});

/* ============================================================
   欢迎页推荐 chips
   ============================================================ */
const RECOMMEND = [
  "彩虹实验室.html",
  "齿轮.html",
  "电路迷宫.html",
  "气球火箭.html",
  "毛细现象.html",
  "种子的一生.html"
];

function buildChips() {
  chipsEl.innerHTML = "";
  RECOMMEND.forEach(function (file) {
    let found = null;
    DATA.forEach(function (g) {
      g.items.forEach(function (it) {
        if (it.file === file) found = it;
      });
    });
    if (!found) return;

    const btn = document.createElement("button");
    btn.className = "chip";
    btn.type = "button";
    btn.textContent = found.icon + " " + found.title;
    btn.addEventListener("click", function () { selectItem(found); });
    chipsEl.appendChild(btn);
  });
}

/* ============================================================
   启动
   ============================================================ */
buildChips();
buildList("");

// 恢复上次打开的实验
(function restore() {
  let last = null;
  try { last = localStorage.getItem("sci-lab-current"); } catch (e) {}
  if (!last) return;

  let found = null;
  DATA.forEach(function (g) {
    g.items.forEach(function (it) {
      if (it.file === last) found = it;
    });
  });
  if (found) selectItem(found);
})();
