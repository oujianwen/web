<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>影子怎么来？—— 光 · 物体 · 屏幕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0f1220; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   影子怎么来？ —— 光 + 物体 + 屏幕 = 影子
   ------------------------------------------------------------
   教材依据：
   第五章第三节「光」—— 光是直线前进的；影子形成
   第六章「光影好朋友」—— 哪些东西会有影子？同物不同影？
   第六章「如何显现大亮眼？」—— 必须挡住光才有影子
   第一章「迷思概念」—— 幼儿以为「有光就有影子」

   认知冲突设计：
   ① 只有光，没有物体 → 没有影子
   ② 只有物体，没有光 → 没有影子
   ③ 光 + 物体 → 影子出现
   ④ 光离物体越近，影子越大
   ⑤ 光移动，影子跟着移动
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, DPR, S = 1;
let time = 0;

/* ---------- 场景对象 ---------- */
const light = { x: 0, y: 0, r: 30, on: true, scale: 1 };
const ball  = { x: 0, y: 0, r: 36, visible: true, scale: 1 };
const world = { wallX: 0 };

/* ---------- 交互状态 ---------- */
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let downPos = null;
let activePointer = null;
let shadowWasVisible = false;
let hintAlpha = 1;
let hintTimer = 0;

/* ============================================================
   尺寸与初始化
============================================================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.6, Math.min(1.2, H / 780));

  world.wallX = W * 0.80;

  if (!light.x) {
    light.x = W * 0.20;
    light.y = H * 0.36;
    ball.x = W * 0.52;
    ball.y = H * 0.55;
  }

  light.r = 30 * S;
  ball.r = 36 * S;

  clampPositions();
}

function clampPositions() {
  light.x = Math.max(60 * S, Math.min(world.wallX - 60 * S, light.x));
  light.y = Math.max(60 * S, Math.min(H - 60 * S, light.y));
  ball.x = Math.max(60 * S, Math.min(world.wallX - ball.r - 4, ball.x));
  ball.y = Math.max(60 * S, Math.min(H - 60 * S, ball.y));
}

/* ============================================================
   影子几何计算
   从光源出发，作圆的两条切线，延伸到屏幕，得到影子区间
============================================================ */
function computeShadow() {
  if (!light.on || !ball.visible) return null;

  const dx = ball.x - light.x;
  const dy = ball.y - light.y;
  const d = Math.hypot(dx, dy);
  if (d <= ball.r + 2) return null;

  const base = Math.atan2(dy, dx);
  const alpha = Math.asin(Math.min(1, ball.r / d));

  const ys = [];
  for (const sign of [-1, 1]) {
    const a = base + sign * alpha;
    const c = Math.cos(a);
    const s = Math.sin(a);
    if (Math.abs(c) < 0.02) continue;
    const t = (world.wallX - light.x) / c;
    if (t <= 0) continue;
    ys.push(light.y + t * s);
  }

  if (ys.length < 2) return null;
  return { y1: Math.min(...ys), y2: Math.max(...ys) };
}

/* ============================================================
   绘制：房间背景
============================================================ */
function drawRoom() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141829');
  g.addColorStop(1, '#0b0d18');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   绘制：光源的柔和辉光（在墙面之下）
============================================================ */
function drawGlow() {
  if (!light.on) return;
  const pulse = 1 + Math.sin(time * 2.6) * 0.06;
  const glowR = 170 * S * pulse;

  const g = ctx.createRadialGradient(light.x, light.y, light.r * 0.4, light.x, light.y, glowR);
  g.addColorStop(0, 'rgba(255, 240, 160, 0.45)');
  g.addColorStop(0.45, 'rgba(255, 210, 90, 0.16)');
  g.addColorStop(1, 'rgba(255, 200, 60, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(light.x, light.y, glowR, 0, Math.PI * 2);
  ctx.fill();
}

/* ============================================================
   绘制：屏幕（墙）
============================================================ */
function drawWall() {
  const x = world.wallX;
  const w = W - x;

  // 墙面本体（开灯时亮，关灯时暗）
  const g = ctx.createLinearGradient(x, 0, W, 0);
  if (light.on) {
    g.addColorStop(0, '#5a6280');
    g.addColorStop(0.5, '#474e68');
    g.addColorStop(1, '#363b50');
  } else {
    g.addColorStop(0, '#22263a');
    g.addColorStop(1, '#181b28');
  }
  ctx.fillStyle = g;
  ctx.fillRect(x, 0, w, H);

  // 墙面细微纹理
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  for (let i = x + 18; i < W; i += 26) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, H);
    ctx.stroke();
  }

  // 左边缘高光（立体感）
  const eg = ctx.createLinearGradient(x, 0, x + 18, 0);
  eg.addColorStop(0, 'rgba(255,255,255,0.18)');
  eg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(x, 0, 18, H);

  // 屏幕标注：顶部小图钉
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = `bold ${11 * S}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('屏 幕', x + w / 2, 24 * S);
  ctx.textAlign = 'left';
}

/* ============================================================
   绘制：影子（画在屏幕上）
============================================================ */
function drawShadow(sh) {
  const x = world.wallX;
  const w = W - x;
  const { y1, y2 } = sh;
  const fade = 7 * S;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x, 0, w, H);
  ctx.clip();

  // 影子主体
  ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
  ctx.fillRect(x, y1, w, Math.max(0, y2 - y1));

  // 上下边缘柔化
  const g1 = ctx.createLinearGradient(0, y1 - fade, 0, y1 + fade);
  g1.addColorStop(0, 'rgba(0,0,0,0)');
  g1.addColorStop(0.5, 'rgba(0,0,0,0.82)');
  g1.addColorStop(1, 'rgba(0,0,0,0.82)');
  ctx.fillStyle = g1;
  ctx.fillRect(x, y1 - fade, w, fade * 2);

  const g2 = ctx.createLinearGradient(0, y2 - fade, 0, y2 + fade);
  g2.addColorStop(0, 'rgba(0,0,0,0.82)');
  g2.addColorStop(0.5, 'rgba(0,0,0,0.82)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(x, y2 - fade, w, fade * 2);

  // 影子边缘的高亮轮廓（让影子更有存在感）
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y1);
  ctx.lineTo(W, y1);
  ctx.moveTo(x, y2);
  ctx.lineTo(W, y2);
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   绘制：两条切线光线
============================================================ */
function drawLightRays() {
  if (!light.on || !ball.visible) return;

  const dx = ball.x - light.x;
  const dy = ball.y - light.y;
  const d = Math.hypot(dx, dy);
  if (d <= ball.r + 2) return;

  const base = Math.atan2(dy, dx);
  const alpha = Math.asin(Math.min(1, ball.r / d));

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 235, 160, 0.28)';
  ctx.lineWidth = 1.6 * S;
  ctx.lineCap = 'round';

  for (const sign of [-1, 1]) {
    const a = base + sign * alpha;
    const c = Math.cos(a);
    const s = Math.sin(a);
    if (Math.abs(c) < 0.02) continue;
    const t = (world.wallX - light.x) / c;
    if (t <= 0) continue;
    ctx.beginPath();
    ctx.moveTo(light.x, light.y);
    ctx.lineTo(world.wallX, light.y + t * s);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   绘制：球（物体）
============================================================ */
function drawBall() {
  const scale = ball.scale;

  if (!ball.visible) {
    // 隐藏时留一个虚线幽灵轮廓，方便点击恢复
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#7fb8ff';
    ctx.lineWidth = 2.5 * S;
    ctx.setLineDash([7 * S, 7 * S]);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.scale(scale, scale);

  const r = ball.r;

  // 球体渐变
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
  g.addColorStop(0, '#a8dcff');
  g.addColorStop(0.55, '#4a9fe8');
  g.addColorStop(1, '#1e5490');

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // 边缘光（被灯照到的感觉）
  ctx.strokeStyle = 'rgba(255, 240, 180, 0.5)';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.arc(0, 0, r - 1, Math.PI * 0.85, Math.PI * 1.65);
  ctx.stroke();

  // 高光
  ctx.beginPath();
  ctx.arc(-r * 0.32, -r * 0.36, r * 0.24, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.fill();

  // 眼睛
  const eyeOff = r * 0.30;
  const eyeY = -r * 0.06;
  const eyeR = r * 0.135;

  for (const sign of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(sign * eyeOff, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fillStyle = '#101828';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sign * eyeOff + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  // 微笑
  ctx.beginPath();
  ctx.arc(0, r * 0.14, r * 0.27, 0.22, Math.PI - 0.22);
  ctx.strokeStyle = '#101828';
  ctx.lineWidth = 2.6 * S;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   绘制：灯泡
============================================================ */
function drawLight() {
  const scale = light.scale;
  const r = light.r;
  const isOn = light.on;

  ctx.save();
  ctx.translate(light.x, light.y);
  ctx.scale(scale, scale);

  // 灯泡主体
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.08, 0, 0, r);
  if (isOn) {
    bg.addColorStop(0, '#fffde7');
    bg.addColorStop(0.65, '#ffd54f');
    bg.addColorStop(1, '#f59f00');
  } else {
    bg.addColorStop(0, '#5a6076');
    bg.addColorStop(1, '#2b2f40');
  }

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = bg;
  ctx.fill();

  // 外圈
  ctx.strokeStyle = isOn ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 2.2 * S;
  ctx.stroke();

  // 眼睛
  const eyeR = r * 0.15;
  const eyeY = -r * 0.08;
  const eyeOff = r * 0.30;

  for (const sign of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(sign * eyeOff, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fillStyle = isOn ? '#3a2a00' : '#151824';
    ctx.fill();
    if (isOn) {
      ctx.beginPath();
      ctx.arc(sign * eyeOff + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  // 微笑
  ctx.beginPath();
  ctx.arc(0, r * 0.16, r * 0.28, 0.25, Math.PI - 0.25);
  ctx.strokeStyle = isOn ? '#3a2a00' : '#151824';
  ctx.lineWidth = 2.2 * S;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   绘制：底部操作提示（几秒后淡出）
============================================================ */
function drawHint() {
  if (hintAlpha <= 0.01) return;

  const text = '👆 拖动灯泡和球试试看';
  ctx.save();
  ctx.globalAlpha = hintAlpha;

  ctx.font = `bold ${16 * S}px system-ui, sans-serif`;
  const tw = ctx.measureText(text).width;
  const padX = 22 * S;
  const bh = 46 * S;
  const bw = tw + padX * 2;
  const bx = W / 2 - bw / 2;
  const by = H - bh - 34 * S;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  roundRect(bx, by, bw, bh, bh / 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2 + 1);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ============================================================
   音效（Web Audio 合成，无需外部文件）
============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}
function beep(freq, dur, vol = 0.08, type = 'sine') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
function sfxOn()  { beep(660, 0.09, 0.09); setTimeout(() => beep(880, 0.13, 0.09), 80); }
function sfxOff() { beep(440, 0.09, 0.07); setTimeout(() => beep(330, 0.14, 0.07), 80); }
function sfxPop() { beep(520, 0.06, 0.06, 'triangle'); }

/* ============================================================
   交互
============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function onDown(e) {
  initAudio();
  if (activePointer !== null) return;
  activePointer = e.pointerId;
  const p = getPos(e);
  downPos = p;

  const dl = dist(p, light);
  const db = dist(p, ball);

  // 命中检测：优先灯泡，其次球（触摸目标都放大）
  if (dl < light.r + 34 * S) {
    dragging = 'light';
    dragOffset.x = light.x - p.x;
    dragOffset.y = light.y - p.y;
    light.scale = 1.14;
  } else if (db < ball.r + 34 * S) {
    dragging = 'ball';
    dragOffset.x = ball.x - p.x;
    dragOffset.y = ball.y - p.y;
    ball.scale = 1.14;
  }

  if (dragging) hintAlpha = Math.max(0, hintAlpha - 0.4);
}

function onMove(e) {
  if (activePointer !== e.pointerId || !dragging) return;
  const p = getPos(e);

  if (dragging === 'light') {
    light.x = p.x + dragOffset.x;
    light.y = p.y + dragOffset.y;
  } else {
    ball.x = p.x + dragOffset.x;
    ball.y = p.y + dragOffset.y;
  }
  clampPositions();
}

function onUp(e) {
  if (activePointer !== e.pointerId) return;
  const p = getPos(e);

  if (dragging && downPos && dist(p, downPos) < 12 * S) {
    // 判定为「点击」而不是「拖动」
    if (dragging === 'light') {
      light.on = !light.on;
      light.on ? sfxOn() : sfxOff();
    } else {
      ball.visible = !ball.visible;
      sfxPop();
    }
  }

  light.scale = 1;
  ball.scale = 1;
  dragging = null;
  activePointer = null;
  downPos = null;
}

/* ============================================================
   主循环
============================================================ */
function update(dt) {
  time += dt;

  // 灯泡轻微呼吸
  light.r = 30 * S * (1 + Math.sin(time * 2.4) * 0.02);

  // 提示 6 秒后淡出
  hintTimer += dt;
  if (hintTimer > 6 && hintAlpha > 0) {
    hintAlpha = Math.max(0, hintAlpha - dt * 0.8);
  }

  // 影子「从无到有」时，给一个愉悦的弹跳反馈
  const sh = computeShadow();
  const hasShadow = !!sh;
  if (hasShadow && !shadowWasVisible) {
    gsap.killTweensOf(ball);
    gsap.fromTo(ball, { scale: 1.18 }, {
      scale: 1, duration: 0.5, ease: 'elastic.out(1, 0.45)'
    });
  }
  shadowWasVisible = hasShadow;
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawRoom();       // 房间背景
  drawGlow();       // 灯泡的光晕
  drawWall();       // 屏幕

  const sh = computeShadow();
  if (sh) drawShadow(sh);   // 影子（在屏幕上）

  drawLightRays();  // 两条切线光线
  drawBall();       // 物体
  drawLight();      // 灯泡

  drawHint();       // 底部提示
}

/* ============================================================
   启动
============================================================ */
resize();
window.addEventListener('resize', () => { resize(); });

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('dblclick', e => e.preventDefault());

render();

gsap.ticker.add((t, deltaTime) => {
  const dt = Math.min(deltaTime, 50) / 1000;
  update(dt);
  render();
});
</script>
</body>
</html>
