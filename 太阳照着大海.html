<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水循环 —— 太阳 · 蒸发 · 云 · 雨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #0d1020;
    touch-action: none; font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  .panel {
    position: fixed; top: 20px; left: 20px;
    background: rgba(0, 0, 0, 0.5);
    padding: 14px 20px; border-radius: 14px;
    backdrop-filter: blur(10px);
    color: #fff; font-size: 14px; min-width: 230px;
    z-index: 10;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .panel label {
    display: block; margin-bottom: 10px;
    font-weight: bold; color: #ffe066;
  }
  .panel .value {
    float: right; color: #ffd54f; font-weight: bold;
  }
  .panel input[type="range"] {
    width: 100%; accent-color: #ffd54f;
    height: 6px; cursor: pointer;
  }

  .phase-tag {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    padding: 12px 28px; border-radius: 30px;
    font-size: 16px; font-weight: bold;
    backdrop-filter: blur(10px);
    z-index: 10;
    border: 1px solid rgba(255, 255, 255, 0.15);
    white-space: nowrap;
    transition: all 0.4s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel">
  <label>☀️ 太阳强度 <span class="value" id="sv">70%</span></label>
  <input type="range" id="sun" min="0" max="100" value="70">
</div>
<div class="phase-tag" id="phase">☀️ 太阳照着大海</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   水循环 —— 太阳 · 蒸发 · 云 · 雨
   ------------------------------------------------------------
   教材依据：
   第五章第二节「地球科学」—— 水、空气、天气
   第五章第二节「天气」—— 太阳（温暖地球）、降雨（水的循环）
   第一章「迷思概念」—— 蒸发四层级：消失→被吸走→跑到云里→状态改变

   核心概念：
   ① 太阳让水变热，水变成水蒸气升上天空（蒸发）
   ② 水蒸气看不见，升到天空冷的地方聚在一起形成云（凝结）
   ③ 云里的水越聚越多，云变厚变暗，最后落下来就是雨
   ④ 雨水回到大海，又开始新的循环
   ⑤ 没有太阳，循环就停下来
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const phaseTag = document.getElementById('phase');
const sunSlider = document.getElementById('sun');
const sunValue = document.getElementById('sv');

let W, H, DPR, S = 1;
let time = 0;

/* ---------- 场景状态 ---------- */
const scene = {
  sunPower: 0.7,     // 0 ~ 1，太阳强度
  oceanY: 0,
};

const sun = {
  x: 0, y: 0, r: 0,
  rayRotation: 0,
  pulse: 0
};

const cloud = {
  x: 0, y: 0,
  baseR: 40,
  humidity: 0,       // 0 ~ 1，云里的水量
  drift: 0,
  lightning: 0       // 闪电闪光
};

let steamParticles = [];   // 水蒸气粒子
let raindrops = [];        // 雨滴
let splashes = [];         // 水花
let stars = [];            // 星星（夜晚）

/* ---------- 参数 ---------- */
const STEAM_RATE = 8;         // 每秒蒸汽粒子数（sunPower = 1 时）
const STEAM_ABSORB = 0.018;   // 每个蒸汽被吸收时增加的湿度
const RAIN_RATE = 32;         // 每秒雨滴数
const RAIN_COST = 0.008;      // 每个雨滴消耗的湿度

/* ============================================================
   工具
============================================================ */
function lerp(a, b, t) { return a + (b - a) * t; }

/* ============================================================
   尺寸
============================================================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.55, Math.min(1.15, H / 800));

  scene.oceanY = H * 0.72;

  sun.x = W * 0.80;
  sun.y = H * 0.22;
  sun.r = 52 * S;

  cloud.x = W * 0.42;
  cloud.y = H * 0.26;
  cloud.baseR = 44 * S;
}

/* ============================================================
   星星
============================================================ */
function initStars() {
  stars = [];
  const count = Math.floor(W / 28);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (scene.oceanY * 0.8),
      r: 0.7 + Math.random() * 1.8,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.8
    });
  }
}

/* ============================================================
   粒子生成
============================================================ */
function spawnSteam() {
  steamParticles.push({
    x: Math.random() * W,
    y: scene.oceanY - 4 * S,
    vx: (Math.random() - 0.5) * 18,
    vy: -26 - Math.random() * 26,
    r: (5 + Math.random() * 6) * S,
    life: 1,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.6 + Math.random() * 1.4
  });
}

function spawnRaindrop() {
  const cx = cloud.x;
  const cy = cloud.y;
  const spread = cloud.baseR * (1 + cloud.humidity * 1.2);
  raindrops.push({
    x: cx + (Math.random() - 0.5) * spread * 3.2,
    y: cy + cloud.baseR * 0.5,
    vx: (Math.random() - 0.5) * 30,
    vy: 200 + Math.random() * 120,
    life: 1
  });
}

function spawnSplash(x, y) {
  splashes.push({
    x, y,
    r: 3 * S,
    maxR: (14 + Math.random() * 10) * S,
    life: 1
  });
}

/* ============================================================
   更新
============================================================ */
function update(dt) {
  time += dt;

  sun.rayRotation += dt * 0.25;
  sun.pulse = 0.98 + Math.sin(time * 2.5) * 0.02;

  // ---- 生成蒸汽（受太阳强度影响） ----
  const steamRate = scene.sunPower * STEAM_RATE;
  if (Math.random() < steamRate * dt) {
    spawnSteam();
  }

  // ---- 更新蒸汽粒子 ----
  for (const p of steamParticles) {
    p.wobble += p.wobbleSpeed * dt;
    p.x += (p.vx + Math.sin(p.wobble) * 18) * dt;
    p.y += p.vy * dt;
    p.life -= dt * 0.18;

    if (p.life <= 0 || p.y < 40 * S) {
      p.dead = true;
      continue;
    }

    // 到达云的高度 → 被吸收
    const cy = cloud.y + cloud.baseR * 0.4;
    if (p.y < cy) {
      p.dead = true;
      cloud.humidity = Math.min(1, cloud.humidity + STEAM_ABSORB);
    }
  }
  steamParticles = steamParticles.filter(p => !p.dead);

  // ---- 云漂移 ----
  cloud.drift += dt * 0.5;

  // ---- 下雨 ----
  if (cloud.humidity > 0.85) {
    if (Math.random() < RAIN_RATE * dt) {
      spawnRaindrop();
      cloud.humidity = Math.max(0, cloud.humidity - RAIN_COST);
    }
  }

  // ---- 更新雨滴 ----
  for (const d of raindrops) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 500 * dt;

    if (d.y > scene.oceanY) {
      d.dead = true;
      spawnSplash(d.x, scene.oceanY);
    }
  }
  raindrops = raindrops.filter(d => !d.dead);

  // ---- 更新水花 ----
  for (const s of splashes) {
    s.r += (s.maxR - s.r) * Math.min(1, dt * 6);
    s.life -= dt * 1.8;
  }
  splashes = splashes.filter(s => s.life > 0);

  // ---- 更新阶段提示 ----
  updatePhaseLabel();
}

let lastPhaseText = '';
function updatePhaseLabel() {
  let text = '';
  if (scene.sunPower < 0.15 && cloud.humidity < 0.1) {
    text = '🌙 没有太阳，水不再蒸发，循环停下了';
  } else if (cloud.humidity > 0.85) {
    text = '🌧️ 云装满了水，开始下雨啦！';
  } else if (cloud.humidity > 0.35) {
    text = '☁️ 水蒸气越聚越多，云变厚了';
  } else if (cloud.humidity > 0.03) {
    text = '💧 太阳晒热海水，水变成水蒸气升上天空';
  } else {
    text = '☀️ 太阳照着大海';
  }
  if (text !== lastPhaseText) {
    phaseTag.textContent = text;
    lastPhaseText = text;
  }
}

/* ============================================================
   绘制：天空
============================================================ */
function drawSky() {
  const p = scene.sunPower;
  const g = ctx.createLinearGradient(0, 0, 0, scene.oceanY);
  g.addColorStop(0, `rgb(${lerp(15, 88, p)}, ${lerp(20, 180, p)}, ${lerp(50, 240, p)})`);
  g.addColorStop(0.6, `rgb(${lerp(25, 150, p)}, ${lerp(35, 210, p)}, ${lerp(70, 245, p)})`);
  g.addColorStop(1, `rgb(${lerp(40, 200, p)}, ${lerp(55, 230, p)}, ${lerp(95, 250, p)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, scene.oceanY);
}

/* ============================================================
   绘制：星星
============================================================ */
function drawStars() {
  const alpha = Math.max(0, 1 - scene.sunPower * 2.8);
  if (alpha < 0.02) return;
  for (const s of stars) {
    const twinkle = 0.55 + Math.sin(time * s.speed + s.phase) * 0.45;
    ctx.fillStyle = `rgba(255, 255, 220, ${alpha * twinkle})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ============================================================
   绘制：太阳
============================================================ */
function drawSun() {
  const p = scene.sunPower;
  const alpha = p < 0.05 ? 0 : Math.min(1, p * 2);

  ctx.save();
  ctx.globalAlpha = alpha;

  const r = sun.r * sun.pulse;

  // 光晕
  const glowR = r * (2.5 + p * 2);
  const gg = ctx.createRadialGradient(sun.x, sun.y, r * 0.5, sun.x, sun.y, glowR);
  gg.addColorStop(0, `rgba(255, 245, 180, ${0.45 + p * 0.35})`);
  gg.addColorStop(0.35, `rgba(255, 220, 100, ${0.22 + p * 0.2})`);
  gg.addColorStop(1, 'rgba(255, 200, 50, 0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(sun.x, sun.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // 光芒
  ctx.save();
  ctx.translate(sun.x, sun.y);
  ctx.rotate(sun.rayRotation);
  ctx.strokeStyle = `rgba(255, 225, 110, ${0.55 * p})`;
  ctx.lineWidth = 3.2 * S;
  ctx.lineCap = 'round';
  const rayCount = 12;
  for (let i = 0; i < rayCount; i++) {
    const a = (Math.PI * 2 / rayCount) * i;
    const r1 = r * 1.18;
    const r2 = r * 1.45 + Math.sin(time * 3 + i) * 5 * S;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.stroke();
  }
  ctx.restore();

  // 太阳本体
  const sg = ctx.createRadialGradient(
    sun.x - r * 0.3, sun.y - r * 0.3, r * 0.08,
    sun.x, sun.y, r
  );
  sg.addColorStop(0, '#fffde7');
  sg.addColorStop(0.55, '#ffd54f');
  sg.addColorStop(1, '#f59f00');
  ctx.beginPath();
  ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
  ctx.fillStyle = sg;
  ctx.fill();

  // 高光
  ctx.beginPath();
  ctx.arc(sun.x - r * 0.28, sun.y - r * 0.28, r * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.fill();

  ctx.restore();
}

/* ============================================================
   绘制：远山
============================================================ */
function drawHills() {
  const p = scene.sunPower;
  const r = lerp(30, 110, p);
  const g = lerp(60, 155, p);
  const b = lerp(80, 105, p);

  // 远山
  ctx.fillStyle = `rgb(${r * 0.9}, ${g * 0.95}, ${b * 1.05})`;
  ctx.beginPath();
  ctx.moveTo(0, scene.oceanY);
  for (let x = 0; x <= W; x += 18) {
    const y = scene.oceanY - 55 * S
      - Math.sin(x * 0.008 + 1.5) * 42 * S
      - Math.sin(x * 0.02 + 0.4) * 16 * S;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, scene.oceanY);
  ctx.closePath();
  ctx.fill();

  // 近山
  ctx.fillStyle = `rgb(${r * 0.75}, ${g * 0.9}, ${b})`;
  ctx.beginPath();
  ctx.moveTo(0, scene.oceanY);
  for (let x = 0; x <= W; x += 18) {
    const y = scene.oceanY - 30 * S
      - Math.sin(x * 0.012 + 3) * 24 * S
      - Math.sin(x * 0.03 + 1) * 10 * S;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, scene.oceanY);
  ctx.closePath();
  ctx.fill();
}

/* ============================================================
   绘制：云
============================================================ */
function drawCloud() {
  const p = cloud.humidity;
  const baseR = cloud.baseR * (1 + p * 0.7);
  const driftX = Math.sin(cloud.drift) * 26 * S;
  const cx = cloud.x + driftX;
  const cy = cloud.y;

  // 湿度决定颜色：白 → 灰
  const cr = lerp(255, 105, p);
  const cg = lerp(255, 115, p);
  const cb = lerp(255, 135, p);

  // 阴影
  ctx.save();
  ctx.globalAlpha = 0.22 + p * 0.45;
  ctx.fillStyle = `rgb(${cr * 0.5}, ${cg * 0.5}, ${cb * 0.55})`;
  ctx.beginPath();
  ctx.ellipse(cx + 5 * S, cy + baseR * 0.55, baseR * 2.4, baseR * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 云体（多个圆弧合成一朵云）
  const arcs = [
    { dx: -baseR * 1.45, dy: 0,          r: baseR * 0.88 },
    { dx: -baseR * 0.55, dy: -baseR * 0.5, r: baseR * 1.02 },
    { dx:  baseR * 0.55, dy: -baseR * 0.5, r: baseR * 1.02 },
    { dx:  baseR * 1.45, dy: 0,          r: baseR * 0.88 },
    { dx:  0,            dy: -baseR * 0.72, r: baseR * 1.18 },
    { dx:  baseR * 0.85, dy:  baseR * 0.18, r: baseR * 0.75 },
    { dx: -baseR * 0.85, dy:  baseR * 0.18, r: baseR * 0.75 }
  ];

  ctx.beginPath();
  for (const a of arcs) {
    ctx.moveTo(cx + a.dx + a.r, cy + a.dy);
    ctx.arc(cx + a.dx, cy + a.dy, a.r, 0, Math.PI * 2);
  }

  const grad = ctx.createRadialGradient(
    cx - baseR * 0.4, cy - baseR * 0.9, baseR * 0.3,
    cx, cy, baseR * 2.8
  );
  grad.addColorStop(0, `rgb(${Math.min(255, cr + 25)}, ${Math.min(255, cg + 25)}, ${Math.min(255, cb + 25)})`);
  grad.addColorStop(1, `rgb(${cr}, ${cg}, ${cb})`);
  ctx.fillStyle = grad;
  ctx.fill();
}

/* ============================================================
   绘制：海面
============================================================ */
function drawOcean() {
  const p = scene.sunPower;
  const oy = scene.oceanY;

  // 海水渐变
  const g = ctx.createLinearGradient(0, oy, 0, H);
  g.addColorStop(0, `rgb(${lerp(20, 70, p)}, ${lerp(50, 140, p)}, ${lerp(100, 200, p)})`);
  g.addColorStop(0.6, `rgb(${lerp(15, 40, p)}, ${lerp(35, 90, p)}, ${lerp(75, 155, p)})`);
  g.addColorStop(1, `rgb(${lerp(10, 18, p)}, ${lerp(25, 55, p)}, ${lerp(60, 110, p)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, oy, W, H - oy);

  // 太阳在海面的倒影
  if (p > 0.25) {
    ctx.save();
    ctx.globalAlpha = p * 0.55;
    const reflX = sun.x;
    const reflW = sun.r * 0.75;
    for (let y = oy; y < H; y += 7 * S) {
      const wobble = Math.sin(y * 0.08 + time * 3.5) * 5 * S;
      const alpha = 1 - (y - oy) / (H - oy);
      ctx.fillStyle = `rgba(255, 240, 170, ${alpha * 0.55})`;
      ctx.fillRect(reflX + wobble - reflW / 2, y, reflW, 4 * S);
    }
    ctx.restore();
  }

  // 波浪
  ctx.strokeStyle = `rgba(255, 255, 255, ${0.12 + p * 0.18})`;
  ctx.lineWidth = 1.6 * S;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = oy + (i + 1) * 16 * S + Math.sin(x * 0.012 + time * 1.4 + i * 1.7) * 3.5 * S;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

/* ============================================================
   绘制：水蒸气粒子
============================================================ */
function drawSteamParticles() {
  for (const p of steamParticles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life) * 0.55;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    g.addColorStop(0.5, 'rgba(230, 245, 255, 0.5)');
    g.addColorStop(1, 'rgba(200, 230, 255, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   绘制：雨滴
============================================================ */
function drawRaindrops() {
  ctx.save();
  ctx.strokeStyle = 'rgba(180, 220, 255, 0.85)';
  ctx.lineWidth = 2.2 * S;
  ctx.lineCap = 'round';
  for (const d of raindrops) {
    const len = 12 * S;
    const a = Math.atan2(d.vy, d.vx);
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - Math.cos(a) * len, d.y - Math.sin(a) * len);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   绘制：水花
============================================================ */
function drawSplashes() {
  for (const s of splashes) {
    ctx.save();
    ctx.globalAlpha = s.life * 0.7;
    ctx.strokeStyle = 'rgba(200, 235, 255, 0.95)';
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.35, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   渲染
============================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawStars();
  drawSun();
  drawHills();
  drawOcean();
  drawSteamParticles();
  drawCloud();
  drawRaindrops();
  drawSplashes();
}

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}
function beep(freq, dur, vol = 0.06, type = 'sine') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
function sfxClick() { beep(520, 0.07, 0.07, 'triangle'); }

/* ============================================================
   交互：点击太阳切换开/关
============================================================ */
function onCanvasDown(e) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const d = Math.hypot(px - sun.x, py - sun.y);

  if (d < sun.r * 1.8) {
    const newVal = scene.sunPower > 0.3 ? 0 : 0.7;
    gsap.to(scene, {
      sunPower: newVal,
      duration: 0.6,
      ease: 'power2.out'
    });
    sunSlider.value = newVal * 100;
    sunValue.textContent = Math.round(newVal * 100) + '%';
    sfxClick();
  }
}

/* ============================================================
   启动
============================================================ */
function loop(t, deltaTime) {
  const dt = Math.min(deltaTime, 50) / 1000;
  update(dt);
  render();
}

function init() {
  resize();
  initStars();

  window.addEventListener('resize', () => {
    resize();
    initStars();
  });

  // 预生成几个蒸汽，让画面一开始就有"在蒸发"的感觉
  for (let i = 0; i < 5; i++) {
    spawnSteam();
    const p = steamParticles[steamParticles.length - 1];
    p.y = scene.oceanY - Math.random() * 200 * S;
  }

  // 太阳强度滑块
  sunSlider.addEventListener('input', e => {
    initAudio();
    const v = +e.target.value / 100;
    gsap.to(scene, { sunPower: v, duration: 0.4, ease: 'power2.out' });
    sunValue.textContent = Math.round(v * 100) + '%';
  });

  canvas.addEventListener('pointerdown', onCanvasDown);
  canvas.addEventListener('dblclick', e => e.preventDefault());

  render();
  gsap.ticker.add(loop);
}

init();
</script>
</body>
</html>
