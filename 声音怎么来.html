<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>声音怎么来？—— 鼓面上的小颗粒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #100818;
    touch-action: none;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  canvas { display: block; }

  .panel {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: min(520px, 94vw);
    background: rgba(28, 16, 38, 0.82);
    padding: 18px 24px;
    border-radius: 20px;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.13);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .panel .row {
    display: grid;
    grid-template-columns: 90px 1fr 72px;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .panel .row .lbl {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
  }
  .panel input[type="range"] {
    width: 100%;
    height: 6px;
    accent-color: #ff6bd6;
    cursor: pointer;
  }
  .panel .val {
    text-align: right;
    color: #ffb0e8;
    font-weight: bold;
    font-size: 13px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel">
  <div class="row">
    <span class="lbl">💥 敲击力度</span>
    <input type="range" id="power" min="20" max="100" value="70">
    <span class="val" id="powerv">中</span>
  </div>
  <div class="row">
    <span class="lbl">🎵 敲击音调</span>
    <input type="range" id="pitch" min="0" max="100" value="40">
    <span class="val" id="pitchv">中低</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ============================================================
   声音怎么来？—— 鼓面上的小颗粒（修复版）
   ------------------------------------------------------------
   关键修复：颗粒物理的"向上为正"约定统一
   - yOff 正值 = 被顶起的高度（离开鼓面）
   - yVel 正值 = 正在向上运动
   - 重力向下拉 → yVel -= gravity * dt
   - 渲染时 py = baseY - yOff，yOff 越大 = 屏幕上越高
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const powerSlider = document.getElementById('power');
const pitchSlider = document.getElementById('pitch');
const powerVal = document.getElementById('powerv');
const pitchVal = document.getElementById('pitchv');

let W, H, DPR, S = 1;
let time = 0;

/* ---------- 鼓 ---------- */
const drum = {
  x: 0, y: 0,
  rx: 0,
  ry: 0,
  bodyH: 0,
  deform: 0,
  shake: 0,
  hitFlash: 0
};

/* ---------- 音效参数 ---------- */
const sound = {
  power: 0.70,
  pitch: 0.40,
  holding: false,
  holdTimer: 0
};

/* ---------- 颗粒 ---------- */
let particles = [];

/* ---------- 波纹 ---------- */
let ripples = [];

/* ---------- 提示透明度 ---------- */
let hintAlpha = 1;

/* ============================================================
   尺寸
============================================================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.max(0.6, Math.min(1.15, H / 800));

  drum.rx = Math.min(W * 0.28, 190 * S);
  drum.ry = drum.rx * 0.36;
  drum.bodyH = 110 * S;
  drum.x = W * 0.44;
  drum.y = H * 0.48;

  buildParticles();
}

/* ============================================================
   颗粒生成
============================================================ */
const PARTICLE_COLORS = [
  '#ffe066', '#ff8fa3', '#7fdd6e', '#5eb3ff',
  '#c390ff', '#ffb055', '#ff6bd6', '#a8e6ff'
];

function buildParticles() {
  particles = [];
  const count = 44;

  for (let i = 0; i < count; i++) {
    const u = i * 2.399963;
    const rr = Math.sqrt((i + 0.5) / count) * 0.85;

    particles.push({
      u: u,
      rr: rr,
      yOff: 0,
      yVel: 0,
      size: (2.6 + Math.random() * 2.0) * S,
      color: PARTICLE_COLORS[i % PARTICLE_COLORS.length],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 4,
      glowing: 0
    });
  }
}

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
}

function playDrumSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  const baseFreq = 90 + sound.pitch * 180;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseFreq * 2.0, t);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.7, t + 0.18);

  const peak = 0.14 + sound.power * 0.14;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(peak, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.30);

  const t2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  t2.type = 'triangle';
  t2.frequency.setValueAtTime(400 + sound.pitch * 500, t);
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.linearRampToValueAtTime(0.05 + sound.power * 0.04, t + 0.003);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);

  t2.connect(g2);
  g2.connect(audioCtx.destination);
  t2.start(t);
  t2.stop(t + 0.12);
}

/* ============================================================
   敲鼓
============================================================ */
function hitDrum(hitX, hitY) {
  initAudio();

  // 鼓面凹陷动画
  gsap.killTweensOf(drum);
  drum.deform = 1;
  gsap.to(drum, {
    deform: 0,
    duration: 0.65,
    ease: 'elastic.out(1, 0.38)'
  });

  // 鼓身晃动
  drum.shake = 1;
  gsap.killTweensOf(drum, 'shake');
  gsap.to(drum, {
    shake: 0,
    duration: 0.4,
    ease: 'power2.out'
  });

  drum.hitFlash = 1;

  // 给每个颗粒一个向上的初速度（正值 = 向上）
  const power = sound.power;
  for (const p of particles) {
    const px = drum.x + Math.cos(p.u) * p.rr * drum.rx;
    const py = drum.y + Math.sin(p.u) * p.rr * drum.ry;

    const dx = (px - hitX) / drum.rx;
    const dy = (py - hitY) / drum.ry;
    const dist = Math.hypot(dx, dy);
    const falloff = Math.max(0, 1 - dist / 1.2);

    // 正值 = 向上弹起
    const v0 = (160 + 460 * power) * (0.35 + falloff * 0.65);
    p.yVel = v0;
    p.glowing = 1;
  }

  ripples.push({
    x: hitX, y: hitY,
    r: 6 * S,
    maxR: drum.rx * 1.05,
    life: 1
  });

  playDrumSound();

  if (hintAlpha > 0.01) {
    gsap.to({ v: hintAlpha }, {
      v: 0,
      duration: 0.6,
      onUpdate: function () { hintAlpha = this.targets()[0].v; }
    });
  }
}

/* ============================================================
   更新
============================================================ */
function update(dt) {
  time += dt;

  // 按住持续敲击
  if (sound.holding) {
    sound.holdTimer -= dt;
    if (sound.holdTimer <= 0) {
      const jitterX = drum.x + (Math.random() - 0.5) * drum.rx * 0.6;
      const jitterY = drum.y + (Math.random() - 0.5) * drum.ry * 0.6;
      hitDrum(jitterX, jitterY);
      sound.holdTimer = 0.42;
    }
  }

  // ---- 颗粒物理 ----
  const gravity = 1600;
  for (const p of particles) {
    // 重力向下拉（减小向上的速度）
    p.yVel -= gravity * dt;
    // 位移累加（正值 = 向上）
    p.yOff += p.yVel * dt;

    // 落回鼓面
    if (p.yOff <= 0) {
      p.yOff = 0;
      if (p.yVel < -60) {
        // 落得快，弹一下
        p.yVel = -p.yVel * 0.22;
      } else {
        p.yVel = 0;
      }
    }

    p.rot += p.rotSpeed * dt;
    if (p.glowing > 0) p.glowing = Math.max(0, p.glowing - dt * 1.8);
  }

  drum.hitFlash *= Math.exp(-dt * 8);

  for (const r of ripples) {
    r.r += (r.maxR - r.r) * Math.min(1, dt * 5.5);
    r.life -= dt * 1.8;
  }
  ripples = ripples.filter(r => r.life > 0);
}

/* ============================================================
   绘制：背景
============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a0f26');
  g.addColorStop(0.55, '#100818');
  g.addColorStop(1, '#08040d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const stage = ctx.createRadialGradient(
    drum.x, drum.y, 30,
    drum.x, drum.y, Math.max(W, H) * 0.55
  );
  stage.addColorStop(0, 'rgba(255, 120, 220, 0.14)');
  stage.addColorStop(0.5, 'rgba(160, 100, 255, 0.06)');
  stage.addColorStop(1, 'rgba(160, 100, 255, 0)');
  ctx.fillStyle = stage;
  ctx.fillRect(0, 0, W, H);

  const floorY = drum.y + drum.bodyH + 10 * S;
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0, 'rgba(60, 30, 80, 0.35)');
  fg.addColorStop(1, 'rgba(15, 8, 25, 0.8)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, floorY, W, H - floorY);
}

/* ============================================================
   绘制：鼓
============================================================ */
function drawDrum() {
  const cx = drum.x;
  const cy = drum.y;
  const rx = drum.rx;
  const ry = drum.ry;
  const bodyH = drum.bodyH;

  const shakeX = drum.shake > 0.01
    ? Math.sin(time * 55) * 3 * S * drum.shake
    : 0;

  ctx.save();
  ctx.translate(shakeX, 0);

  // ---- 鼓身 ----
  const bodyLeft = cx - rx;
  const bodyRight = cx + rx;
  const bodyTop = cy;
  const bodyBottom = cy + bodyH;

  const bodyGrad = ctx.createLinearGradient(bodyLeft, 0, bodyRight, 0);
  bodyGrad.addColorStop(0, '#7a3a24');
  bodyGrad.addColorStop(0.35, '#b05a30');
  bodyGrad.addColorStop(0.55, '#d47a44');
  bodyGrad.addColorStop(0.85, '#9a4828');
  bodyGrad.addColorStop(1, '#5a2a18');

  ctx.beginPath();
  ctx.moveTo(bodyLeft, bodyTop);
  ctx.lineTo(bodyLeft, bodyBottom);
  ctx.quadraticCurveTo(cx, bodyBottom + ry * 0.9, bodyRight, bodyBottom);
  ctx.lineTo(bodyRight, bodyTop);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // 鼓身装饰
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(bodyLeft, bodyTop);
  ctx.lineTo(bodyLeft, bodyBottom);
  ctx.quadraticCurveTo(cx, bodyBottom + ry * 0.9, bodyRight, bodyBottom);
  ctx.lineTo(bodyRight, bodyTop);
  ctx.closePath();
  ctx.clip();

  const barY1 = bodyTop + bodyH * 0.22;
  const barY2 = bodyTop + bodyH * 0.72;
  for (const by of [barY1, barY2]) {
    const bg = ctx.createLinearGradient(0, by, 0, by + 6 * S);
    bg.addColorStop(0, 'rgba(255, 220, 120, 0.9)');
    bg.addColorStop(1, 'rgba(200, 140, 30, 0.7)');
    ctx.fillStyle = bg;
    ctx.fillRect(bodyLeft, by, rx * 2, 6 * S);
  }

  ctx.fillStyle = 'rgba(255, 235, 160, 0.85)';
  for (let i = 0; i < 8; i++) {
    const t = (i + 0.5) / 8;
    const px = bodyLeft + rx * 2 * t;
    for (const by of [barY1 - 8 * S, barY1 + 14 * S, barY2 - 8 * S, barY2 + 14 * S]) {
      ctx.beginPath();
      ctx.arc(px, by, 2.2 * S, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // ---- 鼓面 ----
  const deform = drum.deform;

  ctx.beginPath();
  ctx.ellipse(cx, cy + 2 * S, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(60, 25, 15, 0.55)';
  ctx.fill();

  const skinGrad = ctx.createRadialGradient(
    cx - rx * 0.3, cy - ry * 0.55, rx * 0.1,
    cx, cy, rx
  );
  skinGrad.addColorStop(0, '#f5e6c8');
  skinGrad.addColorStop(0.55, '#e8d0a0');
  skinGrad.addColorStop(1, '#c0a070');

  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = skinGrad;
  ctx.fill();

  if (deform > 0.02) {
    const sag = deform * 6 * S;
    const dg = ctx.createRadialGradient(
      cx, cy + sag, 4 * S,
      cx, cy + sag, rx * 0.85
    );
    dg.addColorStop(0, `rgba(80, 40, 20, ${0.55 * deform})`);
    dg.addColorStop(0.5, `rgba(120, 70, 30, ${0.25 * deform})`);
    dg.addColorStop(1, 'rgba(120, 70, 30, 0)');

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = dg;
    ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = '#7a3a24';
  ctx.lineWidth = 3 * S;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx, cy, rx * 0.94, ry * 0.94, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 210, 110, 0.55)';
  ctx.lineWidth = 1.4 * S;
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   绘制：颗粒
============================================================ */
function drawParticles() {
  for (const p of particles) {
    const px = drum.x + Math.cos(p.u) * p.rr * drum.rx;
    const baseY = drum.y + Math.sin(p.u) * p.rr * drum.ry;
    const py = baseY - p.yOff;

    // 颗粒在鼓面上的阴影
    if (p.yOff > 2 * S) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 0.35 - p.yOff * 0.0012);
      ctx.beginPath();
      ctx.ellipse(px, baseY, p.size * 0.9, p.size * 0.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(p.rot);

    if (p.glowing > 0.05) {
      ctx.shadowBlur = 14 * S * p.glowing;
      ctx.shadowColor = p.color;
    }

    const s = p.size;
    ctx.beginPath();
    roundRect(-s, -s * 1.1, s * 2, s * 2.2, s * 0.6);
    ctx.fillStyle = p.color;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(-s * 0.35, -s * 0.5, s * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.fill();

    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ============================================================
   绘制：敲击波纹
============================================================ */
function drawRipples() {
  for (const r of ripples) {
    ctx.save();
    ctx.globalAlpha = r.life * 0.85;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * drum.ry / drum.rx, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffb0e8';
    ctx.lineWidth = 2.6 * S;
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   绘制：声波显示
============================================================ */
function drawWaveDisplay() {
  const panelW = Math.min(230 * S, W * 0.30);
  const panelH = 110 * S;
  const px = W - panelW - 26 * S;
  const py = 26 * S;

  ctx.save();
  ctx.fillStyle = 'rgba(28, 16, 38, 0.75)';
  roundRect(px, py, panelW, panelH, 14 * S);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
  ctx.lineWidth = 1;
  roundRect(px, py, panelW, panelH, 14 * S);
  ctx.stroke();

  ctx.font = `bold ${11 * S}px system-ui, sans-serif`;
  ctx.fillStyle = '#a890c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('声波', px + 14 * S, py + 10 * S);

  const waveX = px + 14 * S;
  const waveY = py + 38 * S;
  const waveW = panelW - 28 * S;
  const waveH = panelH - 50 * S;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
  ctx.beginPath();
  ctx.moveTo(waveX, waveY + waveH / 2);
  ctx.lineTo(waveX + waveW, waveY + waveH / 2);
  ctx.stroke();

  const amp = sound.power * waveH * 0.42;
  const freq = 2 + sound.pitch * 8;
  const speed = 6 + sound.pitch * 8;

  ctx.beginPath();
  for (let i = 0; i <= waveW; i += 2) {
    const t = i / waveW;
    const phase = t * Math.PI * 2 * freq + time * speed;
    const y = Math.sin(phase) * amp;
    if (i === 0) ctx.moveTo(waveX + i, waveY + waveH / 2 + y);
    else ctx.lineTo(waveX + i, waveY + waveH / 2 + y);
  }
  const wg = ctx.createLinearGradient(waveX, 0, waveX + waveW, 0);
  wg.addColorStop(0, '#ff6bd6');
  wg.addColorStop(1, '#5eb3ff');
  ctx.strokeStyle = wg;
  ctx.lineWidth = 2.4 * S;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.font = `bold ${10 * S}px system-ui, sans-serif`;
  ctx.fillStyle = '#8898b0';
  ctx.textAlign = 'left';
  ctx.fillText(`振幅 ${Math.round(sound.power * 100)}%`, waveX, py + panelH - 14 * S);
  ctx.textAlign = 'right';
  ctx.fillText(`频率 ${Math.round(freq * 40)} Hz`, px + panelW - 14 * S, py + panelH - 14 * S);

  ctx.restore();
}

/* ============================================================
   绘制：提示
============================================================ */
function drawHint() {
  if (hintAlpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = hintAlpha;

  const text = '👆 点一下鼓面，看颗粒跳起来';
  ctx.font = `bold ${16 * S}px system-ui, sans-serif`;
  const tw = ctx.measureText(text).width;
  const padX = 22 * S;
  const bh = 44 * S;
  const bw = tw + padX * 2;
  const bx = drum.x - bw / 2;
  const by = drum.y + drum.bodyH + 34 * S;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  roundRect(bx, by, bw, bh, bh / 2);
  ctx.fill();

  ctx.fillStyle = '#ffb0e8';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, drum.x, by + bh / 2 + 1);

  ctx.restore();
}

/* ============================================================
   渲染
============================================================ */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawDrum();
  drawRipples();
  drawParticles();
  drawWaveDisplay();
  drawHint();
}

/* ============================================================
   交互
============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function isOnDrum(p) {
  const dx = (p.x - drum.x) / drum.rx;
  const dy = (p.y - drum.y) / drum.ry;
  return dx * dx + dy * dy <= 1.15;
}

function onDown(e) {
  initAudio();
  const p = getPos(e);
  if (isOnDrum(p)) {
    hitDrum(p.x, p.y);
    sound.holding = true;
    sound.holdTimer = 0.42;
  }
}

function onUp() {
  sound.holding = false;
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('dblclick', e => e.preventDefault());

/* ============================================================
   滑杆
============================================================ */
powerSlider.addEventListener('input', e => {
  sound.power = +e.target.value / 100;
  const v = +e.target.value;
  if (v < 40) powerVal.textContent = '弱';
  else if (v < 70) powerVal.textContent = '中';
  else powerVal.textContent = '强';
});

pitchSlider.addEventListener('input', e => {
  sound.pitch = +e.target.value / 100;
  const v = +e.target.value;
  if (v < 20) pitchVal.textContent = '很低';
  else if (v < 40) pitchVal.textContent = '中低';
  else if (v < 60) pitchVal.textContent = '中等';
  else if (v < 80) pitchVal.textContent = '中高';
  else pitchVal.textContent = '很高';
});

/* ============================================================
   启动
============================================================ */
resize();
window.addEventListener('resize', resize);

render();

gsap.ticker.add((t, deltaTime) => {
  const dt = Math.min(deltaTime, 50) / 1000;
  update(dt);
  render();
});
</script>
</body>
</html>
